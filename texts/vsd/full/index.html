  <style>
    :root { --bg: #ffffff; --ink: #0a0a0a; --dim: #888888; --line: #e6e6e6; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; text-align: center; }
    .top { padding: 40px 24px 0; font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--dim); }
    .top a, .meta a { color: var(--dim); text-decoration: none; transition: color .2s ease; }
    .top a:hover, .meta a:hover { color: var(--ink); }
    .hero { padding: 96px 24px 56px; }
    h1 {
      margin: 0 0 20px;
      font-family: 'Cormorant Garamond', 'Times New Roman', Georgia, serif;
      font-style: italic; font-weight: 300;
      font-size: clamp(56px, 9vw, 120px); line-height: 1; letter-spacing: -0.01em;
    }
    .meta { font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--dim); }
    .meta .sep { margin: 0 10px; }

    /* пейволл */
    .wall { max-width: 560px; margin: 0 auto; padding: 0 24px 96px; }
    .wall p { margin: 0 0 32px; font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-size: 24px; line-height: 1.35; }
    .btn {
      display: inline-block; padding: 18px 40px; border: 1px solid var(--ink); border-radius: 999px;
      font-size: 12px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--ink); text-decoration: none;
      background: transparent; cursor: pointer; font-family: inherit; transition: background .2s ease, color .2s ease;
    }
    .btn:hover { background: var(--ink); color: var(--bg); }
    .wall .note { margin-top: 20px; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--dim); }

    /* книга */
    .book { display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 0 24px; }
    .book img { display: block; width: 100%; max-width: 560px; height: auto; aspect-ratio: 1196 / 1861; border: 1px solid var(--line); }
    .dl { padding: 0 24px 64px; }
    .dl.bottom { padding-top: 72px; }
    .end { padding: 24px 24px 64px; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; }
    .end a { color: var(--dim); text-decoration: none; transition: color .2s ease; }
    .end a:hover { color: var(--ink); }

    /* заглушка оплаты */
    .modal { position: fixed; inset: 0; background: rgba(255,255,255,.96); display: none; align-items: center; justify-content: center; padding: 24px; z-index: 10; }
    .modal.open { display: flex; }
    .modal .card { max-width: 420px; }
    .modal h2 { margin: 0 0 16px; font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-weight: 400; font-size: 40px; line-height: 1.05; }
    .modal p { margin: 0 0 28px; font-size: 14px; line-height: 1.6; color: #444; }
    .modal .close { display: block; margin: 24px auto 0; background: none; border: 0; font: inherit; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--dim); cursor: pointer; }

    [hidden] { display: none !important; }
    @media (max-width: 600px) {
      .top { padding-top: 28px; letter-spacing: 0.2em; }
      .hero { padding: 72px 16px 40px; }
      .book { padding: 0 16px; gap: 16px; }
      .book img { border: none; }
      .wall p { font-size: 21px; }
    }

  <script>
    // Временная клиентская заглушка. Реальная проверка оплаты переедет на сервер (Yandex Cloud Functions).
    (function () {
      var KEY = 'vsdUnlocked';
      var q = new URLSearchParams(location.search);
      if (q.get('unlock') === '1') { try { localStorage.setItem(KEY, '1'); } catch (e) {} history.replaceState(null, '', location.pathname); }
      var unlocked = false; try { unlocked = localStorage.getItem(KEY) === '1'; } catch (e) {}
      if (unlocked) { document.getElementById('wall').hidden = true; document.getElementById('opened').hidden = false; }
      var modal = document.getElementById('modal');
      document.getElementById('pay').addEventListener('click', function () { modal.classList.add('open'); });
      document.getElementById('close').addEventListener('click', function () { modal.classList.remove('open'); });
      modal.addEventListener('click', function (e) { if (e.target === modal) modal.classList.remove('open'); });
    })();
  </script>
