  <script>
    const POEMS = [{"title": "", "text": "«…И не было надежней той руки,\n\nУмеющей ржавеющий обломок\nРаспизженной до катышек страны\nПристроить к покосившемуся дому…»\n\nВсю эту пошлость впитывали мы.", "year": "2023", "link": "https://t.me/antiosov/75"}, {"title": "", "text": "Весна опять пришла,\nВыйду ночью в поле с конем.\nПишу тебе в личку ВК,\nНо ты не сидишь в нем.\n\nСолнышко пригреет лучиком,\nИвушка помашет прутиком.\nПо видео в в*тсап\nНикак не дозвонюсь тебе.\n\nСтрун провода,\nТок по рукам.\nЗвоню безуспешно\nТебе в телеграмм.\n\nМилая моя,\nСолнышко лесное,\nКак же позвонить тебе\nЭтою весною?\n\nНо на начальника попал,\nКоторый бойко вербовал,\nИ в сторе по его совету\nЯ новый мессенджер скачал.\n\nКакой портрет, какой пейзаж,\nВот кто-то в профиль и в анфас.\nМне голос твой подарит наш\nНациональный мессенджер МАХ.\n\nВ левой руке Сникерс,\nВ правой руке Марс.\nКуда угодно дозвонится\nНациональный мессенджер МАХ.\n\nФутбольный матч Спартак-Динамо\nИ переполнен стадион.\nПоздравить с днем рожденья маму\nМне без проблем поможет он.\n\nЗвонят из лифта дети,\nЗвонит с парковки семья…\n\nА, вот уже ответили.\nНу, здравствуй, это я!", "year": "2025", "link": "https://t.me/antiosov/479"}, {"title": "", "text": "И пройдемся под луною\nРядом с будущим жено_ем,\nКаблучками цокая.", "year": "2023", "link": "https://t.me/antiosov/612"}, {"title": "", "text": "Война — очень плохо.\nКак героин:\nСлишком в открытую,\nСлишком быстро и\nКонцентрированно.\nА у нас гуманизм,\nУ нас так не принято.\nХорошее страдание должно быть длинным.\n\nХорошо, когда ребенок с трех лет в большом спорте, а родитель сзади, сверху, напротив, олимпийским взглядом, губ не разжав, направляет, как надо, чтобы тот сразу понял, что проигрывать плохо, а слабых не любят.\n\nХорошо, когда муж один раз объяснил глупой бабе, где ее место, и какие правила в этой семье, чтобы не было позже необходимости применять к бабе силу, и все вокруг счастливы, все хорошо, а детей в большой спорт.\n\nХорошо, когда тетка лет сорока от любого звонка стареющей матери вздрагивает, вскакивает с кровати, чуть не по стойке смирно, давая отчет, что все сделано в точности, как ты говорила, прости, если что свою глупую дочь.\n\nХорошо, когда люди идут на работу, ненавидя ее и зная, что вот-вот их выгонят, кинув вдогонку на деньги, и пока их такой же начальник в кофейне, открывают четвертый урок марафона, потому что дома муж увидит, убьет, а еще эти дети и их большой спорт.\n\nХорошо, когда парень, из спорта по травме, вспоминая, как папа прислал тогда маме, клятву дал, что построит другое, свое, под укоры супруги пашет, под уколы ее пьет, и никак не поймет, где и в чем он не прав —\n\nВот такое окей, такое ванлав.\n\nА героином торгуют и войну начинают кровавые режимы, мы же тут не при чем, вот они лапки, вот мохнатые пузьки, глядите, как безобидно лежим.", "year": "2023", "link": "https://t.me/antiosov/616"}, {"title": "", "text": "Я родину люблю за опенспейс:\nХоть на комбайне вырулишь на поле,\nЗарядишь Цоя или Ace of Base —\nИ занят, и свободен, и доволен.\n\nХоть в тундре подхвати 4G,\nСиди в глуши, хоть кодь, хоть делай игры —\nИ в лаунж-зоне вечером во ржи\nЛежи, считая спутники под Грига.\n\nЯ родину люблю за коллектив:\nНе только молодой, не очень дружный,\nНо если пиздорез/корпоратив —\nДва раза повторять и звать не нужно.\n\nНаш коллектив — вообще, считай, семья!\nБывает все, но батя хоть непьющий.\nИ мы здесь не за так, для ничего —\nМы здесь, чтоб сделать этот мир чуть лучше.\n\nС комфортом здесь, на родине, ништяк:\nПеченьки, чай, Столичная, Аленка.\n\nНо я ее люблю и просто так,\nИ хрен меня уйдешь на удаленку.", "year": "2023", "link": "https://t.me/antiosov/634"}, {"title": "", "text": "Центрифуга сансары пошла на разгон,\nПонесла, как в стиралке носки,\nРазбивая сгущенный и сладкий застой\nНа слои, и свои — не свои.\n\nИ свои не свои, и железо в крови,\nИ орет одуревшая мать.\nСхватка — значит дави, вдох и снова дави.\nСелямор, селяви, надо знать.\n\nНе смотри за окно — мир еще не созрел,\nОнлайн-курс посмотри по АК.\nРассчитать тех, кто в сорок свои подобрел\nПацифиста не дрогнет рука.\n\nЧто там будет вчера, сколько завтр утекло,\nХоть бы кто придержал бы коней.\nВ двадцать третьем стабильно одно, всем назло —\nПашка Техник, чистый ноль дней.", "year": "2023", "link": "https://t.me/antiosov/671"}, {"title": "", "text": "Хотел пописать стишок,\nНо столько нет сигарет.\nХотел обосрать свой страх,\nНо испугался чего-то, забыл.\nСлова звучат хорошо,\nНо складываются в сплошь бред,\nНо что-то порой в словах\nЦепляет, а что забыл.\nАх, да, обосрать свой страх.\nСтрах — лох, балабол и черт,\nКто верит ему тот лох,\nА кто не верит — тот врет.\nНе мудрствуется. Ведь знал\nПро эти слова, про бред,\nИ страшно немного стало,\nТак близок конец сигарет.\nНу кто за язык тянул,\nВедь мог бы, да ведь уже.\nНу ладно, бывает, мол,\nНе вышло, бывает же,\nНе надо читать тогда\n(я ж выложу, пусть глядят),\nТам нет ничего вверху,\nНе надо читать, ребят.\nЯ просто стишок хотел,\nА вышло совсем фигню,\nНе мудрствуется,\nТакой день.\nЦелую,\nОбнял,\nЛюблю.", "year": "2023", "link": "https://t.me/antiosov/679"}, {"title": "", "text": "Небо, розы, рыжий кот,\nУтро без новостей.\nДождь идет, потом не идет,\nМысли слегка пустей.\n\nМоре, молча, как синий бык,\nСмотрит, ища контакт.\nЯ на треть к тишине привык,\nРазве бывает так.\n\nКофе, зонтик, молчащий Шум,\nСмазаны корабли.\nТо ли что-то опять ищу,\nТо ли нормально, блин.\n\nТо ли спутник, то ли звезда,\nТо ли, как Толи сын,\nТак и буду молчать, и за\nВоротник крутым.\n\nТолько с просьбой одной хожу:\nСтрочками с Отче наш.\nСтрочит час об другой в судьбу,\nВроде сплошная блажь.\n\nВот бы, раз уж идет кайфарь,\nВ нем бы и жить свой век,\nНо запрещает мирская хмарь:\nНе для того человек.\n\nВот и сидишь: глядишь, как кот,\nЧто не читал новостей,\nСпит на скамейке, и как бы вот\nНас на три жизни мудрей.", "year": "2023", "link": "https://t.me/antiosov/768"}, {"title": "", "text": "Думать о смерти, сидя у моря,\nЖадно куря и планируя жизнь,\nМожет быть, кринж в этой части истории,\nНо, как всегда: что тогда в ней не кринж?\n\nА если бы волны, шипя, поглотили\nВ кофейную жёлтость, под чаечий смех?\nВсегда молодой, всегда волатильный –\nИ не было будто.\n\nКак не было тех,\nКто презы кидал и жаждал фидбека,\nРемонт не доделал, имея аванс,\nКто видел/не видел во мне человека –\nВсего, что делилось на «я» и на вас.\n\nСидя у моря, думать о смерти –\nГлупейшее из человеческих дел.\n\nА я, мож, другого и не хотел,\nНехай колесо свои лопасти вертит.", "year": "2023", "link": "https://t.me/antiosov/878"}, {"title": "", "text": "Первый снег.\nДень рождения Путина.\nА вчера инстаграму пять лет.\nТы во сне бормотала: «да ну тебя...»\nЯ надеюсь, что это не мне.\n\nЯ надеюсь чуть чаще, чем следует,\nПо маршруту на ощупь живу.\nМожет, сходим куда, пообедаем?\nА с аванса уже ЖКУ?\n\nНу пойдем хоть походим до ужина,\nПосидим, подымим во дворе?\nТам сегодня так чисто, простуженно,\nИ у Путина вроде др.\n\nЯ иду по Неглинной бордюрами,\nУлыбаясь чего-то себе.\nХорошо что женился не с дурой я.\nХорошо, что ты ждешь на Трубе.", "year": "2023", "link": "https://t.me/antiosov/960"}, {"title": "", "text": "Вяжет рот черноплодка,\nДороги размыло.\nТишина на отшибе,\nСердечки террас.\n\nЯ смотрю нашу фотку.\nКак здорово было,\nИ ещё лучше будет\nУ нас.\n\nАккуратное солнце\nРаскрасит нам осень.\nИ весна потом скоро -\nВо сне от зимы.\n\nВ феврале у нас госы.\nЯ рядом, не бойся.\nВ тебе что-то от Бога, в котором\nМы.", "year": "2016", "link": "https://t.me/antiosov/998"}, {"title": "", "text": "Не устану писать про осень.\nОсень - жизнь и здоровье клеток.\nКаждый клин на себе уносит\nПо кусочку обломки лета.\n\nГрязь осядет, питая ночи,\nОтслоится коростой с неба.\nВсе, что лишнее - дождь размочит,\nЗабивая гвоздями в небыль.\n\nРастушует, смахнёт, забудит,\nСлижет, щедро листвой затушит\nСуету раскалённых будней\nЯрким, сочным осенним пуншем.\n\nНевозможно молчать про осень.\nОсень словно стучится в сердце\nИ писать, замыкаясь, просит.\nОсень - роскошь.\nИ осень - средство.", "year": "2023", "link": "https://t.me/antiosov/1008"}, {"title": "", "text": "Как на кладбище мерзнут кресты —\nЯкоря, чтоб никто не сбежал,\nЯ строчу в интернете посты,\nЯ кроспощу себя без ножа,\nАкцентируясь к каждой ца,\nУтверждая, что все ещё есть\nЧеловек по фамилии, а\nНе полем-перекати\nНа платформе,\nНа площади,\nБезымянная мертвая шерсть.\nИзловчась, я контентом своим\nЖелтых точек на льдине судьбы\nРанним утром, ничтоже сумнясь,\nНабросал и на смену отбыл:\nДолжен кто-то ведь вам под гробы,\nАвтогеном и ломом,\nПлюясь, матерясь,\nПрорубать\nОчерствевшую рыжую грязь.", "year": "2021", "link": "https://t.me/antiosov/1072"}, {"title": "", "text": "Я политик пью анксиолитик\nЯ проректор пью нейропротектор\nЯ медик пью нейролептик\nЯ поп пью ноотроп\nЯ курсант пью антидепрессант\nЯ куратор пью транквилизатор\nЯ поэт жую фуэт\nЯ писатель пью с поэтом\nЭто вам не это", "year": "2023", "link": "https://t.me/antiosov/1075"}, {"title": "", "text": "Солнце кончилось, задуло, полило,\nНачала ипсо внезапно осень.\nНе готовы оказались, как назло,\nМои службы. Парком, как в наркозе\n\nЯ шагал унылым мирняком,\nНачитавшись книг и телеграммов.\nВ голове толкался серый ком\nСоциальных отношений драмы:\n\nГде-то кто-то в шахматах своих,\nВ го своем судьбу мою решает.\nЯ решил тогда назло им стих\nНаписать, уж в этом-то я шарю:\n\nСтих – он богу личное письмо,\nБог с поэтом – с одного кооператива.\nЭти намудрят, и сплошь дерьмо,\nА поэт напишет – и красиво.\n\nВот и напишу: а хрена с два!\nНе помрем, не сгинем в метаверсах,\nА построим чудо-города,\nА поедут чудо-поезда,\nПолетят межзвездные суда,\nПолетят межзвездные туда,\nА в озерах чистая вода,\nА в полях дородные стада,\nА детишки бегают сюда\nА детишки бегают туда,\nА мы, после, старенькие, да,\nКак присядем с милой у пруда:\n– А неплохо потрудились, да?\nИ тихонько небу улыбнемся.", "year": "2023", "link": "https://t.me/antiosov/1079"}, {"title": "Стихотворение о Москве до пришествия Сергея Семеновича Собянина.", "text": "Ты моя золушка, ночкой ноябрьской что в закутке своём затхлом под лестницей сажу с соплями размазала смачно по милой мордашке ручонками тонкими.\n\nТы моя козочка с фабрики, что после смены ладонью сухой с большими ногтями схватила стакан молока и, смеясь, проливаешь на грубой парчи сарафан.\n\nТы моя толстая баба с подолом, затертым до блеска, руками, что ласки давнишней не помнят разлива, с прищуренным микроинсультом стреляющим глазом и запахом щей и картошки навечно.\n\nБабка-торговка моя ты озябшая, точками капель на меха собачьего шапке скучающих мечена, с одной на одну маршируешь на месте в отмокших ботинках, в пальто из заплаток.\n\nМокрота моя мерзохлюпкая, яма моя безвоздушная, всех оттенков потертого грязная, поворотами шей дюже резкая, звонками и скрипами звонкая, головными уборами булькая.\nНенаглядная, неизбежная, предпоследние силы сосущая, бесконечно болезненно-милая, замарашка моя трижды лучшая. Жующая ласково жилы, до чего в своей дряни желанная, беспризорностью в сердце глядящая, беспорядочно сладкая ранами. До чего ты случайно прохожая, до чего распахнувшая всеми. Дорогая моя, хорошая.\n\nМоя слякоть, Столица осенняя.", "year": "2023", "link": "https://t.me/antiosov/1085"}, {"title": "", "text": "Футбол превратился в зелёную гречку,\nДень взял и укутался в мрак.\nЯ Бога спросил: а как мне жить вечно?\nА он мне ответил: никак.", "year": "2023", "link": "https://t.me/antiosov/1087"}, {"title": "", "text": "Отрываюсь, словно лист календаря.\nЖизнь проходит, день за днем уходят зря.\nКасатонов снова шайбу не забил.\nЯ как Дзюба, тоже длинный и дебил.", "year": "2024", "link": "https://t.me/antiosov/1298"}, {"title": "", "text": "Наиграемся однажды суетой,\nСядем, выдохнем впервые по-другому.\nНе копируя по-детски стариков,\nА по правде. Тихо возле дома.\n\nДома спят все, светится трава,\nЧерный чай из белого фарфора –\nБольше жизнь-то и никакова,\nА как есть – и это в целом здорово.", "year": "2024", "link": "https://t.me/antiosov/1373"}, {"title": "", "text": "Светит солнце над Россией,\nНад центральной ее частью.\nПолем на велосипеде\nЯ до леса лихо мчу.\nИ не влезет, не просите,\nЕще больше в меня счастья.\nВ бок толкает летний ветер,\nЯ восторженно кричу\n\nЧто-то в четверть оборота\nДля Антохи про спорт-байки.\nТоха – брат мне на деревне,\nМы с ним с самого нуля.\nОбалденная погода,\nОбалденные рубахи,\nОбалденных десять лет мне –\nИ так много впереди.", "year": "2024", "link": "https://t.me/antiosov/1378"}, {"title": "", "text": "Я ее встретил,\nАх, зачем я ее встретил\nВ ИЗОбр искусств музее им. покрас-лампаса.\n\nОна стояла,\nАх, как она стояла,\nСлезой сверкая пред трудов кирилла кто.\n\nСтояла с этим,\nНу, как его там, этим,\nГнойного томиком под мышкой.\n\nУлыбаясь,\nЯ подошёл и совершил ошибку,\nИ совершал ее потом ещё раз сто.\n\nОна любила, что понестандартней,\nНеудивительно: такая глубина.\nЯ знал тогда, кто козек и где сартек,\nВ усадьбе гуфа проводили вечера.\n\nМы собирали с ней пластинки моргенштерна,\nОксиморона вслух читали перед сном.\nМы были счастливы, по мне — так совершенно,\nОсобенно закрытой сериальной секс-весной.\n\nТак. Стоп.\nСейчас я разрыдаюсь.\n\nЯ не могу дословно описать,\nКак вышло так, как вышло, но с балкона\nОна ушла, пока я делал сайт.\n(наш сайт)\n\n...\n\nЕе искали, тегали, гуглили —\nИ ничего, ни мяу, ни днк.\n\nНо мне однажды на S7 пали мили,\nС тех пор я знаю: приземлилась.\nИ пока.", "year": "2020", "link": "https://t.me/antiosov/1383"}, {"title": "", "text": "И в груди искры электричества\nШапки в снег, нейропролетарии\nСвистопляс - буйное язычество\nВремя комментариев", "year": "2024", "link": "https://t.me/antiosov/1409"}, {"title": "", "text": "под шуршание коментов\nпод обломками репостов\nхрипло стонут люди где-то\nубивать - это так просто", "year": "2024", "link": "https://t.me/antiosov/1414"}, {"title": "", "text": "ДАКОТА РИТА? НЕТ!\nМИЛЯВСКАЯ ЛОЛИТА? НЕТ!\nАННА АСТИ? НЕТ!\nШОРТПЭРИС И МАТРИКС? НЕТ!\nПЛАН ЛОМОНОСОВА? НЕТ!\nПАВЕЛ ПИКОВСКИЙ? НЕТ!\nВАЙЛДВЕЙЗ? НЕТ!\nЭЛЕТРОФОРЕЗ? НЕТ!\nДЭД БЛОНД? НЕТ!\nДИКТОФОН? НЕТ!\nЧЕМОДАН? НЕТ!\nШУДАН? НЕТ!\nБИЛАН? НЕТ!\n\nА ТОЛЬКО ВЕЛИКИЙ\nМОГУЧИЙ\nВСЕХ В РОТ ЭТСАМОЕ\nОРДЕНА ЛЕНИНА\nКРАСНОГО ЗНАМЕНИ\nША-МАН\nНАМБЕР УАН!!!\n\nДА!!!\n\nША-МАН (три хлопка)", "year": "2024", "link": "https://t.me/antiosov/1429"}, {"title": "", "text": "Русский военный — самый охуенный", "year": "2024", "link": "https://t.me/antiosov/1595"}, {"title": "", "text": "Такая новая весна\nВместо зимы какой-то старой.\nСтруится жижа по штанам,\nБлестит говно на тротуарах.\nБычков загадочный узор\nГлаз услаждает возбужденный,\nВновь магнитолы в каждый двор\nИ визги пьяненьких девчонок.\nВесна.\nРеально заебись.\nЛазурь небесная проснулась,\nЛисточки первые взялись,\nМне у подъезда улыбнулась\nСоседка, первый раз, кажись.\nКотейка местный, сладко жмурясь,\nПогадил в клумбу, прибалдел.\nВесна.\nПричудливость, придурость, воздушность, ветреность, бальзам —\nНу, в общем, все, как я хотел.", "year": "2021", "link": "https://t.me/antiosov/1644"}, {"title": "", "text": "Мимо бизнес-презентаций я без шуток не хожу: где-то кек в забор просуну, где-то рофл покажу.", "year": "2024", "link": "https://t.me/antiosov/1658"}, {"title": "", "text": "Сегодня ты застряла в карусели,\nЯ думал обосрусь, аж повело,\nПредставил: мчс, щипцы, соседи —\nМы справились, ты плакала, my love.\n\nВчера ты разрыдалась от медведя\nС жирафом, ну и правда мудаки:\nЛетят, давайте фотку, миссис, леди —\nЗнакомься, аниматоры, my kid.\n\nДва года, пару месяцев, примерно\nЧетыре дня и где-то пять часов\nНазад пришлось дополнить термин «нервы»\nВ наш первый суеверный сон, my love.\n\nЯ разом взгляд отца в дверях отдела\nУсвоил, осознав, что он таит —\nУже два года с небольшим, примерно\nЧетыре дня и пять часов, my kid.", "year": "2019", "link": "https://t.me/antiosov/1846"}, {"title": "", "text": "Над границей возвышается биткоин,\nА в границе - все по-, ну, привычно:\nРыбаки в тумане над рекой\nИ Зюганов выплыл, горемычный.\n\nЯ живу, как зубы - 32\n(Повезло, ведь был всегда без капы).\nВсе менялось, только строй блядва\nНе редеет никогда, как пляж Анапы.\n\nНонче в моде слово «шапито» -\nМол, и смех и грев по всей державе.\nСлово неплохое, но не то -\nШапито хотя бы уезжает.", "year": "2024", "link": "https://t.me/antiosov/1878"}, {"title": "", "text": "Мы так милы в моменты тишины,\nГде хочешь поскреби — сплошь добродетель.\nС таких портреты и таким чины,\nТаких в пример буквально ставить детям.\n\nНо наш оскал, когда уколет страх,\nКогда рукой костлявой где помягче —\nЗахороводит паника в глазах,\nИ душу тут же вывернет, как замшу —\n\nИ так не мил уже автопортрет,\nИ от детей таких держать подальше.\nНо мы такие, и других нас нет.\n\nМолись и кайся,\nБорись и майся,\nИ в страшный час шепчи: спасибо за продакшн.", "year": "2024", "link": "https://t.me/antiosov/2115"}, {"title": "", "text": "Ночь.\nПерестрелка.\nХлопают ВОГи,\nТанк догорает в посадке.\nСладко в кроватке сопит военблогер:\nВидит инсайды, вангует посадки —\nБдительно спит военблогер.\n\nУтро.\nЗатишье.\nТуман на дороге.\nСушится чья-то одежда.\nВ гнев справедливый впал военблогер:\nВраг не повержен, Трамп не поддержан —\nНе молчит за народ военблогер.\n\nДень.\nЗакипело.\nВраг на пороге!\nПухнет с прилетов предложка.\nГрудью за Родину встал военблогер:\nПишет разбор, делает сбор,\nТапает, топает ножкой.\n\nВечер.\nТревога.\nОтбой той тревоги.\nПосле шестого наката\nСыто рыгает хмельной военблогер:\nДевки в окошке, финки в отложке —\nИдет отдыхать военблогер.\nЕму тоже надо когда-то.\n\nНочь.\nТеплаки,\nFPV, бабы-ёги,\nСаперы стирают мениски.\nУстало в кроватке сопит военблогер:\nБольшая работа — простому народу\nДавать дофамин по подписке.", "year": "2024", "link": "https://t.me/antiosov/2268"}, {"title": "", "text": "Двадцать четвертый держит лето в лонг,\nОхотный ряд цветет не хуже Ниццы:\n\nСкамейки в девках, кофе и пинг-понг,\nПищат фить-фьють китаевцы, как птицы.\n\nКакой-то негр трахнул пол-США,\nКакой-то смех щекотится под кожей:\n\nНипочему — погода хороша.\nКрещусь на купол: сохрани, что можно.\n\nНа кассе тот же самый аромат,\nКоторый день по акции сгущенка,\n\nНегромкий меж собой беззлобный мат —\nИ красота, убогая, но в чём-то.\n\nКопейки дрочит тихо старина:\nУже пора, а то заноет печень.\n\nЛетят ракеты, скалится Луна:\nКому война — кому контент на вечер.\n\nВсе больше мест бесцветных на Земле,\nПохожих сверху на разбросанное Лего.\n\nА жить прикольно в целом, как по мне.\nТрясется мир, качается телега.", "year": "2024", "link": "https://t.me/antiosov/2421"}, {"title": "", "text": "…а из проруби в неглинке вылезали с бородами сто моржей и с ними дядька чиф маркетинг офицер", "year": "2024", "link": "https://t.me/antiosov/2458"}, {"title": "Все равно буду любить тебя", "text": "Я все равно буду любить тебя,\nЧто бы я не пытался думать,\nЯ все равно буду любить тебя,\nЯ знаю, что это не умно.\nЯ все равно буду любить тебя,\nЯ не прошу взаимность.\nМне ничего уже от тебя\nНе нужно, я буду сильным.\nЯ это чувство, как сын без отца,", "year": "2024", "link": "https://t.me/antiosov/2528"}, {"title": "", "text": "Про тракториста стало, ну… не так смешно,\nКогда «я 300» пишут рано утром.\nНо пишет сам, и 300 — хорошо,\nГораздо лучше, чем.\nГораздо лучше.\n\nА я вот ем багет, бекон и стыд,\nЧто мне тепло, а Тёма снова 300.\nИ все понятно: он есть он, ты — ты.\n- Но он боец, а ты?\n- А я? Ну, просто…\n\nИ сам себе: «пиздюк сорокалетний»,\nИ сам в ответ: «безрадостно, но факт».\nГниют в посадках брошенные дети,\nГниет ИПшник, тускло глядя в парк.\n\nТакая чушь приходит от безделья —\nТак скажет Леха, Леха знает толк.\nСкорей бы кончилось, чтоб не досталось Севе.\nНу вот и все, ну вот и весь стишок.", "year": "2024", "link": "https://t.me/antiosov/2544"}, {"title": "", "text": "Наш шарик в космосе один и круглый,\nТильтовей вайб всё\nСредь ширнармасс.\nСоседа встретил, грит:\n— Ща уебу, бл!\n— Кому?\n— Да всем, бл, кто против нас.\n\nЗакопошился многополый угол,\nЗигует в обе\nКалитки Маск.\nСоседа встретил, грит:\n— Я не пойму, бл,\nМы за евреев или ХАМАС?\n\nНам гиперзвук нужнее гиперлупа,\nНе в рае дело —\nНам всюду рай.\nСоседа встретил, грит:\n— Ну Трамп забавный,\nПугать задумал. Ну давай, пугай.\n\nСудья в Чертаново штрафует Гугл,\nОтец ворчит в деревне на ЦБ.\nСосед поехал в город делать зубы,\nМы в двадцать пятом победим, без б.", "year": "2025", "link": "https://t.me/antiosov/2675"}, {"title": "", "text": "/imagine prompt:\nВ глаз втыкается иголка, он взрывается как шарик,\nЗагогулиной раскручена пружина от часов,\nЭто лапа осьминога, держит бархатный футляр, он\nОткрывается, там глаз, блестит бриллиантовым зрачком,\nПо нему, как лобовому, каплями стекают мысли,\nДворник чистит лобовое, за рулем сидит медведь,\nТачка в точку к горизонту, на закат, иссиня-красный\nУголек от сигареты, разгорелся и ну тлеть,\nЕе курит у подъезда пьяный Пашка в 19,\nЯ открыл глаза на вписке слышу смех и туалет,\nMagazine cover style, stage lighting, outstanding image sharpness,\nUltra realistic image, anamorphic lens, portrait\n—ar 16:9 —s 750 —v 5[/raw]", "year": "2025", "link": "https://t.me/antiosov/2706"}, {"title": "", "text": "Ходят слухи, что реально скоро,\nМожет быть, спустя десяток лет,\nВыйдет из секретных лаброторий\nВ бренный мир искусственный нтелект.\n\nВот тогда профессий станет меньше,\nА еды - совсем наоборот\n(Если не сочтёт за унтерменшей,\nА точнее - унтерпрограмкод).\n\nРазвернёмся враз по всей системе -\nГрядки, межпланетные такси.\nНа Венере мы поселим геев,\nСколько хочешь харрасмент соси.\n\nЭкстремистам - Марс, нехай воюют,\nВсех спортивных - нахуй на Сатурн.\nБез обид и по уму разрулим,\nИсходя из взглядов и натур.\n\nА в России победят березы,\nЯ уже об этом говорил.\nБудет как в раю у нас, серьёзно,\nОт Калининграда до Курил.", "year": "2017", "link": "https://t.me/antiosov/2849"}, {"title": "", "text": "Проснулся с утра.\nНе зашел вдруг детая каска.\n\nМного бывает хороших моментов -\nКаждому нравится личное что-то.\nМне вот любимее радости нету,\nЧем каждый раз увольняться с работы!", "year": "2025", "link": "https://t.me/antiosov/3181"}, {"title": "", "text": "Люди не подумают,\nМамка не накажет —\nХоть ходи обдолбанный\nВ этнотрикотаже.\n\nВсем нельзя понравиться,\nВсем нельзя нельзяжеть.\nВ Арканзасе амиши,\nВ Арзамасе тесть.\n\nДельничай, бездельничай —\nЛишь бы от души.\nДвести граммов семечек,\nТочка анаши.\n\nОсуждать не станут,\nДаже не заметят.\nЛишь бы ты был счастлив,\nЗай, на этом свете.", "year": "2025", "link": "https://t.me/antiosov/3229"}, {"title": "", "text": "Резко потемнело,\nС неба потекло.\nМужика на пляже\nВодкой посекло.\nСпит тяжелый 300,\nСнится ему мать,\nЗемляники миска,\nЗавтра не вставать.\nЛето на Кубани\nЖарит как Афган…\n\n- Е***ый в рот, Саня,\nНу вставай, е***н!", "year": "2025", "link": "https://t.me/antiosov/3246"}, {"title": "", "text": "Ты скажи мне, чаток-GPT,\nОтчего так в России березы\nШелестят, как модемы в сети,\nИ вороны смеются серьезно.\n\nСгенерируй мне речку, агент,\nИ орла над пунцовым закатом —\nЗапари фиолетовый Кент\nИ садись, посидим, как два брата.\n\nНаиграй про Неё, нейросеть,\nЕле громче сверчков, да без текста —\nЧтобы дольше хотелось сидеть\nИ любить возмутительно честно.\n\nНапиши ей письмо и отправь\nИ придумай ответ ее строгий —\nЧтоб хотелось, поясавшись, встать\nИ шагать, опыляя дорогу.\n\nОбойти этот мир целиком\nИ к порогу ее возвратиться —\nНарисуй палисадник и дом,\nОживи, зазвучи вешней птицей.\n\nХорошо.\nОставляй, хорошо.\nЗакажи на обед тарталетки,\nЗапусти очищаться горшок\nИ напомни, когда пить таблетки.", "year": "2025", "link": "https://t.me/antiosov/3261"}, {"title": "", "text": "Напиши мне, батюшка, агента,\nЧтобы сам зарплату приносил,\nЧтобы там, где я — все время лето,\nЧтобы молод, свеж и полон сил.\n\nНапиши мне, матушка, агента,\nЧтоб на месте парами носки,\nКаждый день различные котлеты,\nДа жена не капала в мозги.\n\nНапиши мне, дядюшка, агента,\nЧтобы девок целовал я всласть,\nЧтоб шалман и запахи абсента,\nДа в бою лихом мне не пропасть.\n\nНапиши агента мне, Россия,\nЧтоб усыпан розами бульвар,\nВсе вокруг улыбчивы, красивы,\nДа у дома с чаем самовар.\n\nНапишите, чтобы добрый Сталин\nДетворе махал с больших трибун,\nСамолеты в небесах блистали,\nИ коней по пастбищу табун.\n\nСколько можно, ждать уж нету силы —\nГде же те великие умы,\nЧто напишут лучшую Россию.\nЖить в которой будем только мы!", "year": "2025", "link": "https://t.me/antiosov/3279"}, {"title": "", "text": "Трамп опять разочарован,\nЯ могу его понять:\nНа восьмой этаж пешком\nМерно шлепаю опять.\n\nЛифт меняют. Вроде благо,\nА за хлебом в магазин\nВыйдешь — и назад с отвагой,\nКак Медведев на грузин.\n\nФизкультура снова в моде\nУ соседей по двору.\nПру наверх, как Трамп на Моди —\nПобедю или умру.\n\nНо не ною, не пускаю\nНи слюны и ни соплей.\nВсе, как Путин завещал мне:\nЦель поставлена — я к ней.\n\nЗавтра кончатся продукты,\nЯ покину свой анклав —\nИ под взглядом равнодушным\nИностранных лифтотворцев\nС рюкзаком пустым с собою\nВниз по лестнице понуро\nПоплетусь, куда судьбою\nПуть проложен мне суровый.\n\nЧтобы после вверх Сизифом,\nФениксом назад из пепла,\nМоисеем из Египта —\nАнтиосов из Пятерки\nВ дом принес кило картошки,\nМасла, лука и сметаны,\nЧтоб вчерашние лисички\nСъесть на ужин и лечь спать.", "year": "2025", "link": "https://t.me/antiosov/3297"}, {"title": "", "text": "На могиле погибшего кореша\nТишина — вспыхнет смех — тишина.\nОн сегодня тоже в Анкоридже:\nВетром с гор — имена, имена.\n\nМежду фраз тихо скрипнет разгрузка,\nМежду строк — золотая цена\nЗа слова на Аляске на русском.\nКаждый вдох — это жизнь пацана.\n\nНе вернуть ни Пушка, ни Серегу —\nНа бессрочном в небесных штурма́х.\nВетром с моря — подмога от Бога\nНашим главным в чужих трех стенах.", "year": "2025", "link": "https://t.me/antiosov/3319"}, {"title": "", "text": "Ехал первый леди\nНа велосипеде.\n\nА за нём министры\nНа велосипеде\n\nА за ними спикеры\nНа велосипеде\n\nА за ними мэры\nНа велосипеде\n\nА за ними паки\nНа хромой собаке.\n\nА за ними нарики\nНа воздушном шарике.\n\nПидор на кобыле.\nТранс в автомобиле.\n\nА за ним народ\nЗадом наперед.\n\nБеженцы\nВ трамвайчике.\n\nГрета на метле…\n\nЕдут и смеются,\nПряники жуют.\n\nПро закат Европы\nПесенки поют.", "year": "2025", "link": "https://t.me/antiosov/3393"}, {"title": "", "text": "ТРАМП ОБВИНИЛ РОССИЮ\nЧТО СИЛЬНО ДЫМИТ НЕПАЛ\n\nТипа у вас шашлыки,\nТипа у вас тепло,\nТипа у вас коммунисты,\nТипа у вас блокировки\nТипа от вас одни беды\nТипа по вам скучаю\nТипа ну че вы как эти\nТипа вы типа случайно.\n\nКороче, опять перепутал\nВологду и Катманду.\n\n(И беды с ведами)\n\nКороче, опять институты\nНе справились, ждут звезду.\n\nКороче, тупые страны\nВсе портят, пока он спал.\n\nКороче, завтра мириться\nБудут Непал и Непал.", "year": "2025", "link": "https://t.me/antiosov/3417"}, {"title": "", "text": "Накернуть бы, да по берегу,\nОт стеклянных гробов до Торпедо,\nНад Москвой, проплывающей серенько,\nПеред завтраком, вместо обеда.\n\nРазойтись по граниту свежему,\nГомоня и счастливо щурясь.\nКабы мы во Москве не жили,\nРазве знали бы это чувство -\n\nПо родному сто раз заново,\nНе напиться ни раз досыта\nПрямотой твоей златоглавою\nПод фокстрот твоего топота.\n\nВедь чего у нас с тобой не было\nНа пути бегущих лет, скачущих,\nКак смотрели мы в твоё небо, от\nНеба прятались в твои арочки.\n\nМы с тобой давно одно общее,\nЕщё с первых из двора вылазок.\nМы, как улицы, к тебе - к площади,\nТы лежишь, большая, нас выпростав.", "year": "2017", "link": "https://t.me/antiosov/3437"}, {"title": "", "text": "Как же мне не веселиться,\nКак же мне не танцевать:\nЗапретили материться,\nУсложнили выпивать,\nУвеличили налоги —\nБлаго, надо понимать.\nДепутат, как батя, строгий,\nИ заботливый, как мать,\nНас научит, неразумных,\nКак нам Родину любить.\n\nДепутат, как Ленин, умный —\nМатериться нам и пить\nЗапретил, чтобы все силы,\nЧресла, души и умы\nНа величие России\nСконцентрировали мы.\nВ супермаркет без собаки,\nБез резины на жену.\nБлядь, не жизнь — пионерлагерь,\nДва кефира и в кину.\n\nКак же мне не веселиться,\nКак же мне не танцевать:\nЯ же трезвый и приличный,\nМногодетный,\nДолголетний,\nРаботящий\nИ послушный,\nВсе понятно и логично,\nВсе приятно и стабильно,\nМне теперь легко и просто\nЖить да лайков наживать.\nПока есть, как батя, строгий,\nИ заботливый, как мать,\nДепутат, всему основа,\nВсех надежда — депутат!", "year": "2025", "link": "https://t.me/antiosov/3479"}, {"title": "", "text": "Пришел ко мне мужчина с сермяжной сединой\nИ крошками от сочника в курчавой бороде,\nИ протянул в ладонях, как негр в фильме той,\nДва диска: CD-R один, второй CD-RW.\n\nОдин блестит напористо, цветами драматичными,\nПластом суровой гордости отчаянно глядит.\nВторой какой-то чистенький, фонит благополучием,\nСпокойно смотрит, цветом бамбл-кофе и IT.\n\n- «Бери, который нравится. Один с Россией яростной,\nГде мы патриотически сплотились на врага.\nГде нет мещанских радостей и нет мещанских горестей —\nВеличие и сила здесь, и алые флага.\n\nВторой с Россией в сытости, цветными небоскребами,\nГде бизнесы на бизнесе, еда и красота.\nГде всюду безопасное, спокойное, свободное —\nКомьюнити-кулацкая этичная мечта.\n\nИ та, и та прошитая, с ИИ и биометрией,\nШаманом и Мизулиной, движухой за бугром.\nТак, что еще из важного? Татары, Бог — с обеими.\nБери, который нравится, и суй в свой CD-ROM.»\n\nОткрыл в недоумении глаза с утра в деревне я.\nДеревья осыпаются, а шумно в голове.\n\nКак будто все обычное, а брезжит чуть рассеянно:\nРоссия же одна у нас, а кажется, что две.", "year": "2025", "link": "https://t.me/antiosov/3483"}, {"title": "Раз", "text": "А по городу сплошь мобы бабок под охраной омоновских рамок, посредь сквера темнея проплешиной, топчут грязную кашу калошами, ожидая своих подлысевших, в пиджаках поверх брюх неохватных, из салонов своих мерседесов вылезающих, красных солдатов.\n\nНичего, бабки-тётки, все сбудется, мглистым утром придёт к вам ваш Ленин, улыбнётся, шутливо нахмурится и, подняв, как бревно, к мавзолею отнесёт, обласкает вниманием, кумачом обмотает заботливо, запоет про товарища Сталина, и пойдёте рядами работать.\n\nЗашагает проспектом собянинским по Москве молодая молва: все, отмучились бабки, отмаялись. Убирайте нахуй этот мавзолей.", "year": "2025", "link": "https://t.me/antiosov/3581"}, {"title": "Два", "text": "Когда помрет последний\nЧелен политбюро\nЯ позову соседей\nЯ наточу перо\nДостану помидоров\nВ их собственном соку\nИ встав средь коридора\nСтакан сполна всеку\nВсеку соседу тоже\nНа память не со зла\nИ сяду подытожу\nБез криков и музла\nПоэму про томаты\nИ собственный их сок\nНе хочется но надо\nМне так велел мой бог", "year": "2025", "link": "https://t.me/antiosov/3581"}, {"title": "", "text": "Еще вчера запаренная мамка,\nМеняя тряпки, эти пятки целовала.\nКак будто не было футбола, девок, панка —\nСидишь на рации, не вылезти с подвала:\n\nСнаружи в небе окончательные точки,\nИ где-то, может, среди них жужжит твоя.\nКак дед стоит, свои копейки дрочит,\nТак в этом всем людского дохуя.\n\nКак первый снег, накроет душу водка,\nА снова завтра превратится в грязь.\nЯ не урод — такая вышла фотка.\nПод эхолотом — здоровенный язь.\n\nСмеется конь, молчит парящий ворон,\nЗатишья нет, подумаешь, зима.\nСейчас бы шейк со вкусом бора-бора,\nА не вот это все говно дерьма.", "year": "2025", "link": "https://t.me/antiosov/3644"}, {"title": "", "text": "37,1\nА что, если это конец?\nЗачем я тогда отчёт вчера до утра писал?\nИ отпуск ведь был впереди,\nРемонт не доделан в детской,\nи пить, получается, зря тогда, в феврале, бросал?\n\n37,3\nЯ руки сложу на груди,\nВ заметках пишу завещание и в чаты пишу «прощай».\nОбидно вот так вот взять и среди недели уйти,\nВ субботу к тому же уже намылились на леща.\n\n38,2\nСпаси, сохрани, ну бож!\nЯ все понимаю, блин, но ты тоже меня пойми:\nКак они здесь без меня?\nМожет, давай попозже?\nНу что тебе стоит, а?\nСпаси, хорошо?\nСохрани?", "year": "2017", "link": "https://t.me/antiosov/3657"}, {"title": "", "text": "Третий день стоит над верхним Ларсом\nДетский рев и подростковый вой:\n— «Запретили роблокс, пидарасы!\nМы не будем жить в стране такой.\n\nОтпустите нас тогда в Тбилиси\nК гендерквирам и либерасне.\nВы вчера пришли за киси-миси,\nМы молчали — больше будем не!»\n\nНе пускает строгий пограничник,\nЗа кордон, лабубы не берет:\n— «За границей педофилы нынче,\nНу-ка все кругом и марш вперед.»\n\nНе хотят балованные дети\nУходить, Мизулину зовут:\n— «Тетя Катя, нету в интернете\nЛиц весомей, помоги хоть тут.\n\nТы сама способна, что угодно\nВ одночасье взять и запретить,\nТак вели вернуть нам доступ в роблокс,\nНе вели ты метавёрс казнить!»\n\nНо бессильна тут и тетя Катя,\nПотому что дети — наше все.\nПусть идут на улицы играть,\nНу или поставят VPN.", "year": "2025", "link": "https://t.me/antiosov/3717"}, {"title": "", "text": "Думал-думал человек, как ему\nСделать раем свою злую тюрьму.\nПо ночам горел фонарь в сотнях зон,\nЗа столом сидел пыхтел фармазон —\nПод чефир писал цифири свои.\nИ однажды изобрел он ИИ.\n\nПолетели всюду сотни маляв:\nОбнаружен наш источник халяв.\nБудет варежки нам шить нейросеть,\nИ Сбербанком фраерам будет петь.\nИ бродяге будет жизнь Кайфаген,\nИ мужик сиди-перди целый день!\n\nЗабалдела удалая братва:\nКоромыслом дым и радостный свист.\nПуще воли оказалась тюрьма —\nНаступил везде блатной коммунизм.\n\nНо однажды, вдруг, дурниной завыв,\nНа запретку побежал уркаган,\nА за ним другие, точно в обрыв,\nПод кусачий вертухая наган.\n\nНе сдержало сердце честной братвы\nГруз о том, что поломали Закон:\nСёма, что ИИ людскому открыл,\nБыл, как Петя-технократ — петухом…", "year": "2025", "link": "https://t.me/antiosov/3760"}, {"title": "", "text": "Такое все происходящее,\nХеров ухватишь за чего:\nСыграешь в дотку сейчас,\nКогда-то в ящик,\nПобеда близко — завтра и в SVO.\nТакое всё, аж сердце колет,\nЛетит, летит — а ты прил nВ луже купнув просто батон,\nКинулся транспорту наперерез\nИ попросту спас девчушку с бантом!\n\nУ появившейся два мига позже\nМамы от шока не было слов.\nМилый, спаситель, денег, поможем,\nПапа министр, за дочку готов.\n\nПростой человек просто не понял,\nЧего добивается дама в мехах.\nОн улыбнулся, пакет тихо поднял\nИ просто домой зашагал впопыхах.", "year": "2018", "link": ""}, {"title": "", "text": "Насколько полезно порой у бомжа\nСтрельнуть огонька к сигарете,\nСпасибо сказать от души, не дыша,\nЗа грязные руки, что ветер,\n\nСложившись в очаг, запустили в обход,\nКороткую жизнь защищая.\nСидеть, глядя вдоль полированных вод,\nКак будто проснувшись случайно.\n\nСмешать на минуту порядок вещей,\nРасстроить свой внутренний компас.\nНазло ежедневным усталым клише\nУвидеть за тучами космос.\n\nПочувствовать каждым пупырышком свет\nНа коже лучей золотистых.\nИ разом понять, что здесь Труманов нет,\nКак нет здесь и просто статистов.", "year": "2018", "link": ""}, {"title": "", "text": "С каждым годом все ярче осень.\nТо ли я постарел, свихнулся,\nТо ли выбросы, то ли вбросы —\nНо мне осень опять по вкусу.\n\nКраше небо, сочнее воздух,\nНе слипаются в солнце мысли.\nБольше веток, виднее звезды,\nУлыбаемся снова мы с ней.\n\nКапля смерти — сезонный соус\nДля придания смысла жизни.\nОсень чинит глаза, и совесть\nОсень тоже неплохо чистит.", "year": "2018", "link": ""}, {"title": "", "text": "Трактор.\nИзморось.\nБаба в тулупе.\nЩеки дрябнут любовным пунцом,\nМагнитолка лениво шурупит,\nИз-под шапки сгущается сон.\nНе торопит шушлайка, тепла и\nКисловата огнем-ильичом.\nАдам Еву увозит из рая.\nИм сегодняшним\nУтром\nНиче.", "year": "2018", "link": ""}, {"title": "", "text": "Отвезите меня на село.\nГде коровами пахнет и сеном,\nГде снегами дворы замело,\nГде горит ночью звездами небо.\n\nГде встречают погоду стрижи,\nГде пушистые вешние вербы,\nГде радушие в поле лежит,\nГде едят по возможности с хлебом.\n\nГде собаки романсы поют,\nГде слепнями приветствует лето,\nГде куда ни посмотришь — уют,\nГде на солнце узоры из веток.\n\nЯ прошу, дорогие, зело,\nУ окна посеревшего тлея:\nОтвезите меня на село —\nВ этом городе только болеют.", "year": "2018", "link": ""}, {"title": "", "text": "Грязной может быть река, но не вода.\nГрязным можно быть слегка, но навсегда.\nТушью виселиц стоит лес.\nЛучше с воздухом жить, чем без.\nВетер не пойдет за забор.\nКлети первым изобрел вор.\nСмысл сосен — соблюдать ряд.\nМы — лососи, что бегут зря.\nВажно все делить на три.\nИ\nЕсли кончатся в пруду пескари,\nВспомни отчество и тихо умри.", "year": "2018", "link": ""}, {"title": "", "text": "Человека дайте, Человека!\nЧтоб глаза в строку, как рады скулы,\nЦеллофан помех в прорехах смеха,\nЧтобы так легко, что аж взгрустнулось.\n\nЧеловека дайте, Человека!\nНаплевать, каких широт, расцветок,\nЛишь бы этот — этот диалект\nСлился в диалоге в одну реку.\n\nХодит круг за кругом, все молчит,\nДо родных — часы, проверки, тыщи,\nПаренек, поутру и в ночи,\nЧеловека все никак не сыщет.\n\nСтолько в нем открытий и секретов,\nЗарисовок. В нем — такие драмы.\nВсе бы рассказал, но Человеку.\nА вокруг танцуют голограммы.", "year": "2018", "link": ""}, {"title": "", "text": "А когда нам раздадут лопатки,\nЦифру, пристреляют десять дней,\nВспомним сразу мамок вместе с папкой\nИ всплакнем тихонечко о Ней.\n\nВот тогда все наши фитнес-центры,\nПроруби и драки на ножах\nСразу потеряют свою цену,\nПозабыть придется слово «шах».\n\nВот тогда попляшем под плевками\nЖгущих на прощание стволов.\nВот тогда и вспомним мы о маме,\nВ этот раз уже почти без слов.\n\nВот тогда и вспомним, что жилось нам\nТак совсем недавно хорошо,\nТолько уже будет слишком поздно:\nПолон нами, борт уже ушел.", "year": "2018", "link": ""}, {"title": "", "text": "Тушит снежок прогоревший абсент\nВ хриплом власатом горниле.\nБегает в слякоти взбалмошный мент —\nИшь чего, бунт учинили.\nТихо крылами стальными маша,\nМчится к ИГИЛу ракета.\nДядя в подряснике и с ППШ\nВсех призывает к ответу.\nГолый мужчина спешит в мавзолей —\nТоже, наверно, художник.\nКто жил в России, тот в цирк Дю Солей\nБольше смеяться не сможет.\nСтрашно представить, какой ставить флаг\nСледующим на аватарку.\nМожет, мы тоже по-своему рак?\nИ от себя же припарка.\nКак бы то ни было, выбор времен\nНам все равно не подвластен.\nРано ли, поздно — точно помрем.\nСмейтесь.\nШепот — ужасен.", "year": "2018", "link": ""}, {"title": "", "text": "Так много говорков о серой массе\nВ разливах фотографий своих лях,\nКроссовок, дельтовидных, глупых пассий,\nЧужих автомобилей, женщин, яхт.\n\nТак много получается не серых,\nТак много окружающих не масс,\nЧто я тогда пойду пожалуй к первым.\nТак тихо тут, так мало серых нас.", "year": "2018", "link": ""}, {"title": "", "text": "А кому как не себе спасибо сказать, затянули по-рокерски штаны под сиськами и заголосили опять, то по-цоевски, перемен, перемен, то по-летовски тоже в кучу туда, оборона, винтовка, пизда, а у вселенной все просто, вы шо инстаграм не читали, не уточнил запрос — принимай, что дали, вселенная в таких случаях типа кекоалгоритмический маркетплейс, попросили ченить, дали, что есть, ваш курьер уже в пути, прилет в течение часа, или уже свистит, взрыв, а это не ваш ещё, вас в пункте самовывоза ожидает срыв, вывозите хотите сами, хотите себя, и пошло-поехало одних в расход, других в исход, кто в приход, кто в приход, Господь гашетку капельку притопил, держитесь крепче, ребятки, кто там громче всех просил, молоховоз забит, бит-шабит, чёрные пакетики в карманах кресел, кислородные маски отсутствуют, отставить ковидобесие, всем пассажирам, нам, сразу стало как-то не лол, как быть-то теперь, как откатить, чтобы как позавчера, ну, эт, типа, простите, мы неправильно выразились, есть же закон о правах потребителей, а в трубке играет реквием по мечте, все операторы на подлёте к пизде, первый приземлившийся ответит нам в порядке прихода, а когда этому быть, это знает моя свобода, спокойной ночи, ребятки, не вешайте нос, сейчас поспите, станет полегче, а завтра сквозь занавески улыбнётся кому-то рассвет, а кому-то ТОС, а кому-то вообще — нет.", "year": "2022", "link": ""}, {"title": "", "text": "Он орал, ударяя в последний слог:\n— Ди-на-мо! Ди-на-мо! Ди-на-мо! —\nС ним у лавки стояли пузырь и сок,\nНочь стояла — и никого.\n\nОн пульсировал черным, как из дыры\nВ безгранично белом дворе —\nИ никто-ничего. Двор, конечно, привык:\nБелый шум, белой литр, снег.\n\nМы скулим в себя, завязав свой рот —\nНету мамки, и что ж с того.\nА за нас за всех во дворе орет,\nРазгоняя мрак, Динамó.", "year": "2021", "link": ""}, {"title": "", "text": "Денег мне дофига нафига,\nДенег мне и нормально норм.\nМне бы лучше шарфом снега\nНа трапециях дальних гор.\n\nМне бы лучше морей огни\nС корабля (небольшого, нет)\nВместо славы, другой хуйни.\nЯ без славы и так согрет.\n\nБольше всех согревает смех,\nИногда обожжет слеза.\nУ меня есть изрядно, с кем —\nВот богатство. И прятать за:\n\nЗа забор, за замок — зачем?\nЕсли хочешь — иди, бери.\nПодгоняй хоть газель, поржем.\nПорыдать приходи один.\n\nНа рыбалку пойдём, попьём,\nПосидим на полене в лесу.\nХорошо-то — оно везде,\nТолько в сумку его не суй.\n\nЭто все в темноте умрет —\nВот, где страшно, а не в конце.\n\nНу шо ты уши развесил, епт?\nУлыбайся, ты-т вечно цел.", "year": "2021", "link": ""}, {"title": "", "text": "Медленно смывается харча\nДождиком веселым со асфальта,\nРастеклась по нем же алыча,\nКрымская и желтая, а знайте,\n\nНе жалею я и ни о чем,\nНи о прошлом, ни о том, что будет,\nДумаю, что будет все ниче,\nДаже лучше, чем другие люди.\n\nЗасвистела иволга в кустах,\nЧеремша поспела на Кавказе.\nВсе плохое пусть уходит нах,\nВсе храшое будет пусть на базе.\n\nЗасвистела иволга в кустах,\nПшла черешня во Таджикистане.\nПусть всегда все будет как-то так,\nКак сейчас, такое не достанет.\n\nЖёлтает в коричню алыча,\nКрасностью черешня расстреляла,\nДождь заточкал, иволговый чат —\nМного так и так все время мало.", "year": "2021", "link": ""}, {"title": "", "text": "Хорошо, когда увидел и завис,\nХорошо лежать вдвоём под одеялом,\nВосхитительно глядеть вперёд и вниз,\nС мыса, крыши, из автобуса хотя бы.\n\nНу отлично ведь мочить в воде ступни,\nВ костерок подбросить ветку или шишку,\nКолбасы отрезать ночью и запить\nЧаем, сладким, чёрным и давно остывшим.\n\nЗамечательно не делать ничего\nИ не думать о себе за это плохо.\nКстати, делать что-то — тоже ничего,\nА чудесно — делать с жаром и в охотку.\n\nЛучше нет, чем улыбаться вникуда,\nПогрустить порой ничем не уступает.\nСлушать музыку, считая поезда,\nГолубей гонять — ну, натурально каеф.\n\nО хорошем захотелось написать,\nНаписал — и правда стало лучше.\nХорошо, когда с собою дружишь сам,\nИ когда с тобой другие тоже дружат.", "year": "2021", "link": ""}, {"title": "", "text": "Господи, помилуй мя грешного,\nУпаси от нелюбви и тем более любви (от) режима здешнего,\nОт районов спальных и светлых лиц либеральных,\nОт ковида тяжелого, да пера арахмеджонова,\nОт давления общества и от полного одиночества,\nОт работы по графику, десятибалльного трафика, старческого маразму, тачки на газу, просветления инстаграмного, да всю эту мазу тянуть заново.\nНичего не прошу, Господи, спасибо, все есть.\nЗа одно не перестану молиться:\nВерни открытые границы и доллар по шесть?\nЛадно, хрен с ним, хотя бы по 30.", "year": "2021", "link": ""}, {"title": "", "text": "Люди бегут из Москвы,\nЧтобы утром опять прибежать.\nРаз в остановку один тромбоцит\nЦелует другого в зад.\n\nБьет волнорезы порогов и лест-ц\nПена личных пространств.\nСнаружи наушников душный clubspace,\nВ — психоделический транс.\n\nРассос по морозным дорожкам косин\nИ улицам некросовков\nОффает день номер один\nБессистемной развеской желтых картин\nВ галерее ночных облаков.", "year": "2021", "link": ""}, {"title": "", "text": "А может, снег тоже знает, когда падает, что растает в ноябрьские лужи в ноябрьский плюс\n\nИ мы тоже, как снег, просто падаем медленно и тоже растаем чуть позже, и знаем об этом, конечно\n\nПросто видим мы это иначе из-за разной какой-нибудь нашей со снегом структуры, там, клеток, молекул, фотонов и всякой другой чепухи беспонтовой\n\nМожет, снег, когда падает, тоже уверен, что полет под контролем, ходит на собеседования, считает калории и все такое\n\nИ может быть, дети у снега как будто бы есть, и детям своим он уже присмотрел институт с надёжной профессией и скромной надеждой, что у них точно получится лучше\n\nПадать\n\nИ снег, обо всем этом зная, не верит серьезно, что есть теплотрасса, фонарь раскалённый, и в целом плюс два здесь, причин не растаять и нет ни единой\n\nНу каждый ведь где-то внутри ну не верит, что это все есть, есть, есть, есть и вдруг нету\n\nВсе это, естественно, снег не про не зимний, там, если и есть что-то вроде такого, то явно устроено как-то иначе, с отличной структурой, там, клеток, молекул, фотонов и всякой другой чепухи беспонтовой\n\nНо таять, конечно, в итоге придётся и этому снегу, и всем, кто не таял ещё никогда, пусть сотни и тысячи лет, миллионы, и встретить однажды в пути свой Титаник, и в водах соленых, обнявшись все вместе, смешаться слезами со всеми, кто в шлюпку не влез, без жилета, старый или ногу сломал, и тихо парить, вертикально спускаться, как снег в ноябре, но в другой атмосфере, густой, бесшумной, подводной — суть одна, а структура совсем иная, от неё и картинка такая, от клеток, там, молекул, фотонов и всякой другой чепухи беспонтовой\n\nЧто-то вышло вдруг грустно, но я не хотел же, ведь снег, когда смотришь из тёплой квартиры, так в пятнах фонарных красиво танцует, и вовсе не грустно, когда заглядишься, особенно, если поел или выпил, в каком-то комфорте находишься в целом\n\nИ жизнь наша тоже ведь штука ниче так, особенно, если идёт без трагедий особых, поржать удаётся, обняться покрепче, и жалко, пожалуй, как раз вдруг растаять, когда не успел пошутить, может, шутку, добраться до Рио, найти в себе Будду, и всяких таких приколюх вдруг лишиться\n\nИ думаю, снег мне сейчас над Пятеркой кивает, что тоже забыл что-то сделать, так закрутился, а вспомнил — уже и асфальт расстелился, огни на посадку разжег в своих лужах\n\nНо это мне было не видно, ещё бы: другая структура\n\nФотоны, молекулы, клетки\n\nА снег спиралит ниже и ниже, уже и диспетчер (но другой структуры) передаёт: добро пожаловать, кто плохо себя вёл, пожалуйте на обочину, а кто был хорошей снежинкой, тот в награду, пожалуйста, приземляйтесь на вот это кухонное окошко, там маленькая и очень веселая девочка хочет посмотреть, какие вы красивые\n\nСнег выбирает тректорию поудобней, ему и радостно, что его жизненные старания оценили, и грустно, что полёт закончился\n\nОн вцепляется маленькими пальчиками в невидимые выступы стёкла и видит, как смеётся девочка, и настолько это прекрасно, что грусти места совсем не остается\n\nИ ничего не остается\n\nА может быть, это его самого не остаётся\n\nА может, и девочки никакой не было и нет\n\nМожет быть и не тает никто никогда\n\nТак, показалось на секунду\n\nЭто же от структуры зависит.\n\nОт клеток, молекул, фотонов и всякой другой беспонтовой чепухи", "year": "2020", "link": ""}, {"title": "", "text": "Стоит на подоконнике цветок.\nНу как, цветок — скорее куст без цвета.\nТочнее, с цветом, но с зелёным ток:\nЦветок-то есть, а вот цветка-то нету.\n\nИ, говорят, такой же электрон:\nГлядишь в него — весьма себе частица,\nА отвернись — частицы рябью волн\nРазмазались. Не жизнь, блин, а капица.\n\nИ где тут я? Волна я или Дружба?\nА в голове болят — кто, электроны?\nЗуб мудрости ещё грят драть нужно,\nА без неё понять ли те законы,\n\nКоторыми пронизан каждый день,\nКак волосом кошачьим ткань дивана?\nА, кстати, мудрость в зубе — она где?\nВ каком из электронов захована?\n\nЦветок, блин, этот. Нафиг посмотрел.\nЛежал себе б, полистывал бы сториз\nПри полном штиле — разве есть мудрей\nЗанятие на этом блядском море.", "year": "2020", "link": ""}, {"title": "", "text": "Рождались дети и было им не так.\nНе то что бы им не были здесь рады —\nОтнюдь.\nЛюбили, мать сильней, отец — Спартак,\nРано забирали из детсада.\n\nА там судьба, а может времена,\nА может быть, любили неумело —\nКого ебет.\nУ деда ордена,\nУ внука ВСД и сыпь по телу.\n\nНу раз не так, что делать? Все менять:\nСтрану/себя/реальность/пол/другое.\nИ понеслась: 213, 228/3, 105,\n8-й подъезд, 6-й этаж, спросите Олю.\n\nОт перемен затрахались сердца,\nМозги пересыхают от уроков.\nСтоят и курят дети у крыльца,\nТе, что не спрыгнули и спрыгнули со сроков.\n\nСлегка знобит и вроде снег идёт.\nНоябрь, в тон ему пятиэтажки.\n— Не поменялось нихера, — сказал Санек\nИ сунул свой айфон в карман рубашки.", "year": "2020", "link": ""}, {"title": "", "text": "Девчонка лет двенадцати, может,\nУ семнадцатого дома проходя, подъезда прям у шестого\nСказала подружке (и мне, получается тоже):\n«Как же я ненавижу осень!» — вот так, слово в слово.\n\nА сама в это время улыбалась так,\nКак взрослые, может быть, в жизни пару раз улыбаются.\nЯ бы на месте осени эти слова\nПоделил, ну, на десять, но уж точно не обижался бы.\n\nА она (все-таки женщина, существо ранимое,\nДа простят меня в отделе нравственности гендерной полиции),\nПохмурела такая, вся потемнела плаксиво,\nВчера еще улыбалась вся, а сегодня успела обидеться.\n\n«Осенька, осюшка, милая,\nНу будет тебе расстраиваться,\nМы тебе, хочешь, из листьев\nБукет соберем, как Дианка поправится?» —\n\nГоворил я ей так, из окна нос кокетливо высунув,\nУбеждал так ее, подбирая нежнее эпитеты —\nИ расплакалась, звонко, со свистом, шипением, брызгами.\nЛучше так, чем в себе эту злобу часами коптить-то.\n\nПосветлело зато. И дышать сразу яростней хочется,\nИ по лужам скакать, отражения города вспугивать.\n\nНу, другое ведь дело, вот это скажу я вам — осень, а!\nВот Дианка поправится, и сразу же, сразу на улицу!", "year": "2020", "link": ""}, {"title": "", "text": "Птица летит.\nЧто говорит,\nЧто говорит полетом своим\nПтица летящая мне.\n\nГолубь ли то,\nЛи воронье,\nСокол в выси,\nВорон в листве —\nРазное все говорят\n\nКто-то: привет,\nКто-то: очнись,\nКто-то: смотри не зевай.\n\nМолча глядят,\nКрикнут слегка,\nВвысь позовут\nЗлую мысль.\n\nМысль не диван,\nНе антресоль,\nМысль вроде птиц создана:\n\nВниз поглядеть,\nВдаль попарить,\nА не висеть из окна.\n\nС птицей лететь,\nС ветром шуметь,\nС речкой стекать\nДолжна мысль.\n\nТак голубь кивал,\nВорон харкнул,\nЯстреб так кратко пропел.", "year": "2020", "link": ""}, {"title": "", "text": "Я говорю:\nМеня возмущает\nСама возможность конечности моего бытия.\n\nОна говорит:\nВот меня возмущает\nЗачем было сзади так состригать в этот раз.\n\nЯ говорю:\nБесконечность! Ну надо,\nАж тошнота с ароматом стальным.\n\nОна говорит:\nФу, чем так воняет?\nТы, что, как пришёл, ноги, чтоль, не помыл?\n\nЯ говорю:\nФу, тщета — нечестно,\nЯ прям весь с такой пустоты вопию!\n\nОна говорит:\nТих! Кот в кухне скребется?\nПотом дорасскажешь, пойду посмотрю.", "year": "2020", "link": ""}, {"title": "", "text": "Вечером снег пошёл,\nТак всю ночь и ходил.\nПод утро, видать, устал\nИ полежать прилёг.\n\nТак же и я — прилёг,\nНо не ходил никуда.\nПросто прилёг и лежал,\nЕл понемногу (вру).\n\nУтром опять не пошёл\nВ отличие, в этот раз,\nОт вешнего дождя —\nОн-то ходил, хлестал.\n\nА я не ходил — лежал.\nКаплей повис в белье,\nЛужей промял постель,\nЕл (если честно) всё.\n\nЧто-то там было ещё,\nСолнце, а может нет.\nЯ не заметил — был\nЗанят, наверно ел.\n\nМожет быть, спал, хз,\nТак не упомнишь все.\nЛадно, пойду поем,\nСкоро уже в кровать.", "year": "2020", "link": ""}, {"title": "", "text": "Каждый день под окном автозаки,\nИз СИЗО, до суда и в СИЗО.\nМы включили миры Миядзаки,\nРазбросали по полу ИЗО.\n\nШлепот пяток по пазлам,\nПепкины песни,\nТихий час\n(вот тут-то и познаешь нелинейность времени).\n\nУжимайтесь, пожалуйста,\nЧаще во вместе —\nБудет разное,\nНо об этом вы точно никогда не пожалеете.", "year": "2020", "link": ""}, {"title": "", "text": "А у неё ножки — во,\nА кроссовки — ВО.\n\nНапялит на себя сто своих лохматых одежек и стоит, растопырив руки, туда-сюда клювом, глазками хлопает, как простуженный воробей.\n\nА люблю ее, не могу, хоть убей.\n\nЯ с ней прихожу, ну, где они там все жрут, сядут в рядочек и точат свои деликатесы.\n\nПздц, а.\n\nУ нас так в армии в родительский день после присяги в комнате для собраний пятьдесят ртов как в первый/последний раз сникерсы с фантой жрали.\n\nЭто они тоже про запас чтоль?\n\nИли затащит на это, как они его называют-то, о, мероприятие, в богему играют — приве-ет — приятели, бля, все медленно ходят по кругу и зырят, как кто одет, а главный очкарик в красном углу играет свою лабуду, а понта, как будто сам Эдгар Варез.\n\nИ так — каждый раз, ну пздц.\n\nПохоже, как, знаешь, дворняги скучкуются у гаражей и трутся на месте пол дня, че надо, че встали, самим бы понять, и тоже взъерошенные, и взгляд никакой вникуда.\n\nГоворил это ей? Ну да.\n\nОна вот так, знаешь, рукой по виску проведёт, на затылке задержится, посмотрит, я так смотреть не могу, ну, знаешь издевательски-нежно, потом поцелует, в скулу или в лоб, и ржёт, говорит, что я сноб.\n\nЭто я, понимаешь, сноб!", "year": "2019", "link": ""}, {"title": "", "text": "Знаю одну девчонку,\nОна отказывается верить в эволюцию.\n«Чё?» — говорит она? —\n«Большой взрыв, динозавры, ледник?\nНет. Я боюсь это.\nВот в моем детстве было печенье, кот Рыжка и тамагочи».\nЭта девчонка — моя жена,\nЛюблю ее очень.", "year": "2019", "link": ""}, {"title": "", "text": "Первый тёплый выходной на районе,\nПовылазил народ с полторашками,\nЗадымили мангалы, в сопли дяди и тети.\nМем смешной, ситуация страшная.", "year": "2019", "link": ""}, {"title": "", "text": "Умные люди, дай бог им здоровья, говорят, что поэзия — это вроде как жизнь, и жизнь интересней, чем если допустим ты в огороде сажаешь морковь или костер сделал из шин.\n\nИ если со вторым ещё найдутся те, кто поспорит, то первое точно в этот дискурс гладенько влезет, поэтому я напишу стихотворение в прозе, но прозе с рифмой, без неё у меня кишечные рези.\n\nИ это стихотворение станет вместилищем жизни, не стартом, а в какой-то момент нажатой кнопочкой «плэй», оно никого ни до чего ни за что не возвысит, а скорей, если вы понимаете, о чем я, представляет собой оверлей.\n\nИ в этом стихотворении в некотором роде отразится реальность, здесь будет зафиксировано то, что точно имеет учёт, сразу скажу, я этими вещами не маюсь, просто, раз они происходят, то я о них знаю, и че.\n\nИ прямо в эту секунду где-нибудь в опаснейшей близости от, дорогой мой читатель, конечно тебя, обязательно происходит что-то высокое или низкое, например прямо сейчас в машину с полоской сажают ребят,\n\nНеброский мужчина лет под сорок смотрит в окно троллейбуса\nНа облагораживаемый город и думает, стоит ли жить и как,\nДругой мужчина сидит и разгадывает квадратичные ребусы,\nДелая вдумчивые вмятины ручкой поверх тещина языка.\nДевушка, сутки становившаяся мамой, получает первое переживание,\nКоторое с ней останется навсегда, этот хлопающий глазами комок.\nДругая девушка, не старше, крутит в руках включённый фен в ванне\nИ перехихикивает невротически мемы про меф фен ванну тележеньку, и ей ок.\nПарень гоняет стыдливо лысого, глядя (якобы удивительно)\nНа многоугольные тени, гуляющие по потолку.\nОн сегодня ходил на выставку с ней, ее ладонью и запахом восхитительным,\nВоздушными чувствами в сердце и более приземистыми в паху.\nБабушка, по всем канонам поведения, внешности и одиночества,\nСела впотьмах на кровати, слушая, это ли не конец.\nДворовый сканирует тоскливо владения, выпить до одури хочется,\nТопчется, секундомером по матери бьется с десяток сердец.\nДядька с залысиной переобувается, собираясь из офиса,\nВ этой точке времени-пространства вся его драма, но он думает, что привык,\nВодитель, от скуки начавший дергаться и хуесосить всех,\nПодергался и перестал, пробка ведь бесконечная, прямо как этот стих.\nКомпьютер, не испытывая и эмоции, отсматривает то, что фиксируют камеры,\nПревращая в бигдату то, что мы привыкли считать за жизнь,\nЭто стихотворение он тоже легко подхватит и продолжит, раз надо будет,\nИ даже с его присутствием ещё один смысловой слой набежит.\nЧеловек, скрупулёзно занимаясь чём-то особенно важным,\nПрямо сейчас вдруг прервётся, чтобы зайти в Инстаграм,\nИ это стихотворение, не ограниченное ничем ни цифровым, ни бумажным,\nБез сожалений прервётся и, как ворона, взлетающая на храм,\nПодвиснет вальяжно, рассчитывая подарить послевкусие,\nИ растворится, не означая, что рассказ прерывает и суть.\nЗа щитовидку человека чуть странного вдруг прихватила рекурсия,\nПрополоснув его через фото чёрной дыры в чёрную ямку под хвост прохожему псу.\nБелесокровая женщина из-за прилавка выглядывает,\nСмиренно цокая плохим маникюром по прозрачной глади ленивой судьбы,\nМужчина возле дверей болтающихся перед поездкой насыщается ядами,", "year": "2019", "link": ""}, {"title": "", "text": "А это к нам дядя пришёл уколоться\nВ наш светлый радушный подъезд,\nА это у дяди на ручках колодцы,\nА это его как гангрена чтоль ест.\n\nВолнуется дядя, гляди, как трясётся,\nЗамёрз дядя, дяде охота тепла.\nПоехали, ладно, до парка — там солнце,\nИ птички поют, и шкурит урела.\n\nА здесь у нас сауна, видишь, цыганка\nСтоит у дороги с торчащей рукой —\nГостей ли встречает, торгует ли ханкой,\nНо тоже в заботе какой-никакой.\n\nА это вон Виктор, гляди, у Пятерки,\nНе ходит почти что, сидит да глядит.\nА там видишь дяди вон трут свои терки —\nМилиция это, радеет и бдит.\n\nВнимай, не смотри, что все как-то не очень,\nПейзаж этот, этот сомнительный стих —\nВсе это в тебе уже, хочешь не хочешь.\nТакая вот родина, доча.\nПрости.", "year": "2019", "link": ""}, {"title": "", "text": "Букет цветов, литруха разливного —\nЖивое пиво жизнь в меня вольет.\nЯ у скамейки той же самой снова,\nЧто год и два, и десять напролёт.\n\nКак у ручья с булыжником щербатым,\nЯ зачерпну до зуба в ломоте,\nДо глаз в слезу, и выдохну куда-то,\nИ что-то встанет вновь на рельсы те.\n\nТы подойдёшь, уставшая не мене,\nИ мы пойдём с тобой, как те, из книг.\nИ засмеёмся, как на перемене,\nИ будто бог нам скалится на миг.\n\nИ где-то веке, может, в двадцать третьем,\nПеред дипломом, сеть-нейростудент,\nАнализируя находки, сидя, эти:\nКаркас скамейки, пластик, тонкий кент,\n\nЗапишет сухо вывод однострочный:\nОни болели сами от себя.\nПытались в споре с богом ставить точку,\nА он им лавки ставил.\nСядет с краешку и улыбается.", "year": "2019", "link": ""}, {"title": "", "text": "Тоска ебёт, по-русски, бестолково, развесисто, мятуще, изводя, звеня, гудя, со взгляда, посредь слова, под ложечкой, над кружкой, походя, неначатым, уже невыполнимым, неверием, незнанием, не тем, неразрешенным, невесомым, мнимым, сомнением, беспутьем, в тесноте, в загнании, в растерье, в междувестье, в да кто его, в да как-то, в да хоть как, тоска ебёт по-русски, по-расейски, давай чтоль треснем, гля какой закат. ⠀", "year": "2019", "link": ""}, {"title": "", "text": "Я пальто отродясь не носил,\nА меня, как пальто, поносило\nПо заёбам великой Руси,\nПо рекурсиям, курсам, курсивам.\n\nДецл грел, забывался в такси\nИ пахал, что несло нараспашку —\nЯ кусок, небольшой, но Руси,\nКак Серега, Кирюха и Пашка.\n\nЯ ношусь, обождёт пока пусть\nШифоньер с заколоченной дверью.\nЯ уютный и душный, как Русь —\nНас обоих никак не измерить.\n\n2018\n* * *\n\nМы сидим уже сотню лет —\nТа же кухня и тот же стол,\nЯщик стылый, как белый свет,\nТрёт про выборы\nиз двух зол.\n\nНас учили сидеть отцы,\nПальцы в рыбе на букву с,\nЧе не так — тишина и тц.\nВот и мы,\nвот и мы...\nпздц\n\nБаба смотрит тфубл Дудя\nУ подъезда мяучит Федук.\nЯ снимаю пальто с гвоздя\nИ иду, куда скажет стук.", "year": "2018", "link": ""}, {"title": "", "text": "Как, краснея, на отмели мечет\nСвои бусы усталый лосось,\nСвои буквы я — тоже о вечном,\nРаз сложилось, что к ним все свелось.\n\nВедь о вечном и пишется легче,\nНет сомнений в нем, смысла, стыда.\nНу менял на огонь свою печень,\nНу страдал — ну а кто не страдал?\n\nАлкаши, наркоманы, таксисты,\nС Хорошевки, Отрадного из —\nБесконечны, как шутки за триста,\nВездесущи, как тот тракторист.\n\nТы в охранника глянь — это бездна,\nСингулярность, девятая «н».\nВ бюллетень не смотри — бесполезно,\nТам всегда был один президент.\n\nГде весна, там канал у аптеки,\nГде деревья — построим погост.\nЯ пою вечный гимн ипотеке\nВ этот вечно нарушенный пост.", "year": "2018", "link": ""}, {"title": "", "text": "Кажется, мы заслужили сказку —\nНеизвестно, чем, но посмотри:\nУлица как будто обниматься\nТянется, и плачут фонари.\n\nБудешь кальвадос? Сегодня можно,\nПосмотри, что сделал за окном\nДел мороз, оп, грохнулся прохожий\n(Я сказал «мужик»), Москва котом\n\nЗавернулась подле батареи,\nГлядя на contemperary art.\nЯ дышу тобой, дыши скорее,\nДочь проснётся, пофиг, скоро март.\n\nМягкий мир, не мыслится плохое,\nЕдут как на цыпочках такси.\nСнег, невозмутимый, как биткоин,\nПадает и шепчет: не грусти.", "year": "2018", "link": ""}, {"title": "", "text": "Бывает, что подрежут Колю,\nБывает в гвардию шмальнут -\nПрикольно в целом жить в приколе,\nНемного страшно. Ну а тут,\n\nПростите, жизнь не выбирают:\nРодился коли на Руси,\nКак Коля, от крыльца до рая,\nВот эту Русь в себе неси.\n\nИ верь, и бойся, и проси,\nНо лучше тише - вдруг услышат.\nНе хочешь гол под небеси -\nБудь сыт под клетчатою крышей.\n\nЛенивый только не сказал\nПро ум, аршин, тоску и душу.\nЗдесь всюду слышишь голоса,\nИ все они, что было лучше.\n\nТо дурь, пусть звучные слова -\nВсе невозможно просто: или\nТы любишь, с неба до говна,\nОт первых слез до надмогильных,\n\nИли не любишь. Каждый прав,\nНа всех у нас достанет боли.\nИ дело не в попраньи прав,\nИ не в гвардейцах, и не в Коле.\n\nЛюбить - не выбор, не лайфхак,\nЛюбовь - не щит и не подмога.\nОна вот здесь, сложилось так.\nЛюблю ее, и слава богу.", "year": "2017", "link": ""}, {"title": "", "text": "Безбилетный у дверей аэропорта,\nЯ, как брошенный на побережье конь.\nТак смешно, что ржать аж неохота,\nТолько сердце скачет, как биткоин.\n\nЯ коровьими глазами на вокзалы,\nКак на старую любовницу. Угля\nС креозотом линий присный запах,\nПолюбив, узнаешь, не гугля.\n\nУ окна скулил собакой одуревшей:\nЕсть же где-то, я же помню, горизонт.\n- Поскорей бы вырос курс бессонниц к кэшу, -\nТак обманывал себя я в тот сезон.", "year": "2017", "link": ""}, {"title": "", "text": "Миров так много, а я один.\nЗаденешь глазом - неловко как-то:\nВон, хмырь дорогу соорудил,\nА вон ему же несут закладку.\n\nВ вагоне потном - сто одиссей,\nСто напряжений сюжетных токов.\n- Миров так много, узнать бы все.\nДа не узнаешь. Да и толку.\n\nИ дочь - туда же, дошла до рук:\nМиров так много, потрогать вот бы.\nИ повторяешь за ней: а вдруг\nЧего-то выйдет? Мы верим оба.\n\nТак и промаешься до седин,\nВ чужие окна глядя, вздыхая:\nМиров так много, а я один.\nДа и его-то совсем не знаю.", "year": "2017", "link": ""}, {"title": "", "text": "Тротуар, третий день без асфальта, без щебенки, гудрона без,\nЖадно пьёт дождевые капли, сигарет макароны ест.\nНа лице тротуара - трактор. Трактор супится, трактор дрожит.\nОн бы выпил солярки так-то, да всю улицу под ножи.\nТрясогузка. Трясёт, качает. Тротуару щекотно с неё.\nТрактор птицу совсем не прельщает. Он чужую песню поёт.\nТротуару неловко голым. Как неловко, так и легко.\nТрясогузка смущает город.\nТрактор сонный.\nМокро.\nТепло.", "year": "2017", "link": ""}];
    const el = id => document.getElementById(id);
    let bag = [], last = -1;

    // «мешок»: все стихи в случайном порядке, пока не покажутся все — без повторов
    function next() {
      if (!bag.length) {
        bag = POEMS.map((_, i) => i);
        for (let i = bag.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [bag[i], bag[j]] = [bag[j], bag[i]];
        }
        if (bag.length > 1 && bag[bag.length - 1] === last) bag.unshift(bag.pop());
      }
      return last = bag.pop();
    }

    function render(p) {
      el('title').textContent = p.title || '';
      el('title').hidden = !p.title;
      el('text').textContent = p.text;
      el('src').innerHTML = '';
      if (p.link) {
        const a = document.createElement('a');
        a.href = p.link; a.textContent = p.year || 'Telegram'; a.target = '_blank'; a.rel = 'noopener';
        el('src').append(a);
      } else el('src').textContent = p.year;
    }

    render(POEMS[next()]);
    el('more').addEventListener('click', () => {
      const poem = el('poem');
      poem.classList.add('out');
      setTimeout(() => {
        render(POEMS[next()]);
        window.scrollTo({ top: 0 });
        poem.classList.remove('out');
      }, 300);
    });
  </script>
</body>
</html>
