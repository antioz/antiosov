  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <meta property="og:type" content="website" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Продукты — Дмитрий Антиосов" />
  <meta name="twitter:description" content="Скиллы для ИИ. Купили один раз — скачиваете сколько нужно." />

  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=Cormorant+Garamond:ital,wght@1,300;1,400&display=swap">

  <link rel="stylesheet" href="../merch/merch.css" />
  <link rel="stylesheet" href="products.css" />
  <link rel="stylesheet" href="../assets/reveal.css" />
<script src="/assets/consent.js" defer></script>
</head>
<body>
  <main id="main">
    <div class="hero">
      <p class="name r" style="--i:0"><a href="/">Дмитрий Антиосов</a></p>
      <h1 class="r" style="--i:1">Продукты</h1>
      <div id="grid" class="grid"></div>
      <p id="empty" class="meta r" style="--i:2;text-align:center;display:none">первый продукт — скоро</p>
    </div>
    <footer class="r" style="--i:3"><a href="/">← на главную</a><a href="/merch/privacy/">персональные данные</a></footer>
  </main>
  <script src="../merch/api.js"></script>
  <script src="products.js"></script>
  <script>
    (async () => {
      const empty = document.getElementById('empty');
      try {
        const { products, now } = await api('catalog', { q: { kind: 'digital' } }); const skew = now ? Date.parse(now) - Date.now() : 0;
        const g = document.getElementById('grid');
        if (!products.length) { empty.style.display = ''; document.getElementById('main').classList.add('empty'); }
        g.innerHTML = products.map((p, i) => {
          const soon = p.has_file === false, ev = p.kind === 'event', left = Math.max(0, p.left | 0);
          return `<a class="card r${ev && !p.sales_open ? ' out' : ''}" style="--i:${i + 2}" href="/products/p/?s=${encodeURIComponent(p.id)}">
            <div class="ph">${p.image_urls && p.image_urls[0] ? `<img src="${esc(p.image_urls[0])}" alt="${esc(p.title)}" loading="lazy">` : ''}</div>
            <div class="t">${esc(p.title)}</div>
            ${ev ? `<div class="p">${esc(evWhen(p.event_at))}</div><div class="p">${rub(p.price)}</div><div class="p"><span class="meta">${!left ? 'мест нет' : !p.sales_open ? 'продажа закрыта' : 'осталось ' + seats(left)}</span></div></a>` : `<div class="p">${p.free_active ? `бесплатно · <span class="meta">ещё ${countdown(p.free_until, skew).short}</span>` : rub(p.price) + (soon ? ' · <span class="meta">скоро</span>' : '')}</div></a>`}`;
        }).join('');
      } catch (e) { empty.textContent = 'раздел временно недоступен'; empty.style.display = ''; document.getElementById('main').classList.add('empty'); }
      showAll();
    })();
  </script>
  <script src="../assets/reveal.js"></script>
</body>
</html>
