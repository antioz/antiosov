<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Продукты — Дмитрий Антиосов</title>
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Продукты — Дмитрий Антиосов" />
  <meta property="og:description" content="Скиллы, практикумы и другие продукты Дмитрия Антиосова." />
  <meta property="og:image" content="https://antiosov.ru/assets/og-words.png" />
  <meta property="og:site_name" content="Антиосов" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="robots" content="noindex" />

  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=Cormorant+Garamond:ital,wght@1,300;1,400&display=swap">

  <link rel="stylesheet" href="../../merch/merch.css" />
  <link rel="stylesheet" href="../products.css?v=20261001a" />
  <link rel="stylesheet" href="../../assets/reveal.css" />
<script src="/assets/consent.js" defer></script>
</head>
<body>
<main>
  <p class="name r in"><a href="/">Дмитрий Антиосов</a></p>
  <div id="root"><p class="meta" style="text-align:center">загружаю…</p></div>
  <footer><a href="/products/">← все продукты</a></footer>
</main>
<script src="../../merch/api.js"></script>
<script src="../products.js?v=20261001a"></script>
<script>
(async () => {
  const root = document.getElementById('root');
  const plural = (n, one, few, many) => { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? one : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? few : many; };
  const slug = new URLSearchParams(location.search).get('s') || ((location.pathname.match(/^\/products\/([a-z0-9][a-z0-9-]*)\/(?:index\.html)?$/) || [])[1]) || ''; // короткий адрес /products/<slug>/
  // Открыли по старому адресу ?s= — показать в адресной строке короткий, если такая страница есть (её собирает products/build-pages.py).
  if (slug && location.pathname.startsWith('/products/p/')) fetch(`/products/${encodeURIComponent(slug)}/`, { method: 'HEAD' }).then(r => { if (r.ok) { const q = new URLSearchParams(location.search); q.delete('s'); history.replaceState(null, '', `/products/${encodeURIComponent(slug)}/${q.toString() ? '?' + q : ''}${location.hash}`); } }).catch(() => {});
  const nope = () => { root.innerHTML = '<p class="center">Нет такого продукта. <a href="/products/">Все продукты</a></p>'; };
  let P, skew = 0;
  try { const r = await api('product', { q: { s: slug } }); P = r.product; skew = r.now ? Date.parse(r.now) - Date.now() : 0; } catch (e) { nope(); return; }
  if (!['digital', 'event', 'diploma', 'book'].includes(P.kind)) { location.replace('/merch/p/?s=' + encodeURIComponent(P.id)); return; }
  document.title = P.title + ' — Продукты — Дмитрий Антиосов';
  const md = s => esc(s).split(/\n{2,}/).map(p => '<p>' + p.replace(/\n/g, '<br>') + '</p>').join('');
  if (P.kind === 'event') return eventPage();
  if (P.kind === 'diploma') return diplomaPage();
  if (P.kind === 'book') return bookPage();

  // Книга: предзаказ с доставкой. Адрес — по частям под Яндекс Доставку (ФИО раздельно, город/улица/дом, квартира отдельно),
  // доставка фиксированная (сервер берёт DELIVERY_FLAT), пожелание для надписи на форзаце. Заказ и оплата — как у вещи мерча.
  function bookPage() {
    const B = { busy: false, qty: 1 }, FLAT = 400;
    const v = (P.variants || []).find(x => x.size === '-'), inStock = !!v && v.available > 0, canPre = !inStock && P.preorder_allowed;
    const open = inStock || canPre;
    const total = () => P.price * B.qty + FLAT;
    const label = () => !open ? 'Предзаказ закрыт' : `${inStock ? 'Оплатить' : 'Оформить предзаказ'} · ${rub(total())}`;
    const fld = (n, t, attrs = '', opt = false) => `<label class="field" data-f="${n}"><span>${t}${opt ? ' <i class="optional">— можно пропустить</i>' : ''}</span><input name="${n}" ${attrs}></label>`;
    root.innerHTML = `<div class="product">
    ${galleryHtml(P.image_urls || [], P.title)}
    <div>
      <h2>${esc(P.title)}</h2><div class="price">${rub(P.price)}</div>
      ${canPre ? `<p class="pretag meta">предзаказ${P.preorder_ship_by ? ' · отправка до ' + esc(P.preorder_ship_by) : ''}</p>` : ''}
      <div class="desc">${md(P.description_md)}</div>
      <form id="f" novalidate>
        <label class="field" data-f="qty"><span>Сколько экземпляров</span><select name="qty" id="qty">${[1, 2, 3, 4, 5].map(n => `<option value="${n}">${n}</option>`).join('')}</select></label>
        <div class="wish"><p>Скажите, что написать на форзаце. Если не скажете, то напишу что в голову придет. А кто знает, какое у меня будет на тот момент настроение, вдруг грустное, а вам потом жить с этим (изданием книги)</p>
          <label class="field" data-f="inscription"><span>Что написать на форзаце</span><textarea name="inscription" maxlength="500" placeholder="Например: Маше — с любовью. Если книг несколько, напишите для каждой"></textarea></label></div>
        <div class="meta" style="margin:6px 0 10px">Кому отправить</div>
        <div class="row2">${fld('last_name', 'Фамилия', 'autocomplete="family-name" required')}${fld('first_name', 'Имя', 'autocomplete="given-name" required')}</div>
        ${fld('middle_name', 'Отчество', 'autocomplete="additional-name"', true)}
        <div class="row2">${fld('phone', 'Телефон', 'type="tel" autocomplete="tel" required')}${fld('email', 'E-mail', 'type="email" autocomplete="email" required')}</div>
        <div class="meta" style="margin:6px 0 10px">Как получить</div>
        <div class="opts"><label><input type="radio" name="pref" value="door" checked><span>Курьером до двери<small>Яндекс Доставка</small></span></label>
          <label><input type="radio" name="pref" value="pvz"><span>В пункт выдачи рядом с адресом<small>пункт подберу перед отправкой — за пару месяцев они могут переехать</small></span></label></div>
        ${fld('city', 'Город или населённый пункт', 'autocomplete="address-level2" required')}
        ${fld('street', 'Улица', 'autocomplete="address-line1" required')}
        <div class="row3">${fld('house', 'Дом, корпус', 'required')}${fld('flat', 'Квартира', '', false)}${fld('zip', 'Индекс', 'inputmode="numeric" maxlength="6" autocomplete="postal-code"', false)}</div>
        ${fld('addr_comment', 'Подъезд, этаж, домофон', '', true)}
        <label class="check" data-f="offer"><input type="checkbox" name="offer" required> <span>Принимаю условия <a href="/offer/" target="_blank">оферты</a></span></label>
        <label class="check" data-f="consent"><input type="checkbox" name="consent" required> <span>Даю <a href="/consent/" target="_blank">согласие на обработку персональных данных</a></span></label>
        <div class="sum"><span>Книга</span><span id="sItem"></span></div>
        <div class="sum"><span>Доставка</span><span>${rub(FLAT)}</span></div>
        <div class="sum total"><span>Итого</span><span id="sTotal"></span></div>
        <div id="err" class="notice err" style="display:none"></div>
        <button class="btn" id="pay" type="submit" style="margin-top:16px">${label()}</button>
        <p class="fine">${canPre ? `Это предзаказ: оплата сейчас, отправка${P.preorder_ship_by ? ' до ' + esc(P.preorder_ship_by) : ' — как только книга выйдет'}. ` : ''}Чек придёт на e-mail. Условия возврата — в <a href="/offer/" target="_blank">оферте</a>. <a href="/merch/privacy/" target="_blank">Политика обработки персональных данных</a>.</p>
      </form>
    </div></div>`;
    const $ = s => root.querySelector(s);
    bindGallery(root, P.image_urls || []);
    const sum = () => { $('#sItem').textContent = rub(P.price * B.qty); $('#sTotal').textContent = rub(total()); if (!B.busy) $('#pay').textContent = label(); };
    $('#qty').onchange = e => { B.qty = +e.target.value; sum(); }; sum(); $('#pay').disabled = !open;
    const FIELD_RU = { last_name: 'фамилия', first_name: 'имя', phone: 'телефон', email: 'e-mail', city: 'город', street: 'улица', house: 'дом', zip: 'индекс (6 цифр)', qty: 'количество', consent: 'согласие', offer: 'оферта' };
    const showErr = (m, f) => { $('#err').textContent = m; $('#err').style.display = ''; if (f) { const el = root.querySelector(`[data-f="${f}"]`); if (el) { el.classList.add('err'); el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } } };
    $('#f').onsubmit = async e => {
      e.preventDefault(); if (B.busy || !open) return;
      const f = new FormData(e.target), g = k => String(f.get(k) || '').trim();
      root.querySelectorAll('.field, .check').forEach(x => x.classList.remove('err')); $('#err').style.display = 'none';
      const body = { product_id: P.id, qty: B.qty, last_name: g('last_name'), first_name: g('first_name'), middle_name: g('middle_name'), phone: g('phone'), email: g('email'),
        pref: g('pref'), city: g('city'), street: g('street'), house: g('house'), flat: g('flat'), zip: g('zip'), addr_comment: g('addr_comment'), inscription: g('inscription'),
        offer: f.get('offer') === 'on', consent: f.get('consent') === 'on' };
      for (const k of ['last_name', 'first_name', 'phone', 'email', 'city', 'street', 'house']) if (!body[k]) return showErr('Заполните поле: ' + FIELD_RU[k] + '.', k);
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(body.email)) return showErr('Проверьте e-mail — на него придёт чек.', 'email');
      if (body.zip && !/^\d{6}$/.test(body.zip)) return showErr('Индекс — 6 цифр (или оставьте пустым).', 'zip');
      if (!body.offer) return showErr('Нужно принять условия оферты.', 'offer');
      if (!body.consent) return showErr('Нужно согласие на обработку данных.', 'consent');
      B.busy = true; $('#pay').disabled = true; $('#pay').textContent = 'Секунду…';
      try { const r = await api('order', { method: 'POST', body }); location.href = r.paymentUrl; }
      catch (err) {
        B.busy = false; $('#pay').disabled = false; $('#pay').textContent = label();
        const field = err.data && err.data.field;
        const m = { sold_out: 'Предзаказ только что закрылся — все экземпляры разобраны.', validation: 'Проверьте поле: ' + (FIELD_RU[field] || 'данные формы') + '.',
          payment_init: 'Платёжная система не отвечает, попробуйте через минуту.', no_product: 'Этого продукта больше нет.', bad_json: 'Магазин временно недоступен, попробуйте через минуту.' }[err.message] || 'Что-то пошло не так, попробуйте ещё раз.';
        showErr(m, field);
      }
    };
    showAll();
  }

  // Мероприятие: билеты 1…min(qty_max, left), только e-mail для чека. Остаток и «продажа открыта» решает сервер.
  function eventPage() {
    const E = { busy: false, qty: 1 };
    const left = () => Math.max(0, P.left | 0), max = () => Math.max(1, Math.min(P.qty_max || 5, left()));
    const label = () => !P.sales_open ? (left() ? 'Продажа закрыта' : 'Мест нет') : `Купить ${E.qty} ${plural(E.qty, 'билет', 'билета', 'билетов')} за ${rub(P.price * E.qty)}`;
    root.innerHTML = `<div class="product">
    <div class="gallery full">${(P.image_urls || []).map(u => `<img src="${esc(u)}" alt="${esc(P.title)}">`).join('') || '<img alt="">'}</div>
    <div>
      <h2>${esc(P.title)}</h2>
      <p class="ev"><b>когда</b>${esc(evWhen(P.event_at, true))}</p>
      ${P.venue ? `<p class="ev"><b>где</b>${esc(P.venue)}</p>` : ''}
      ${P.age_mark ? `<p class="ev"><span class="age">${esc(P.age_mark)}</span></p>` : ''}
      <div class="price" style="margin-top:16px">${rub(P.price)} <span class="meta">за билет</span></div>
      <div class="desc">${md(P.description_md)}</div>
      <div class="seatsbox" id="left"><span class="n" id="leftn"></span><span class="meta" id="leftw"></span></div>
      <form id="f" novalidate>
        <label class="field" data-f="qty"><span>Сколько билетов</span><select name="qty" id="qty"></select></label>
        <label class="field" data-f="email"><span>E-mail для чека</span><input name="email" type="email" autocomplete="email" required></label>
        <label class="check" data-f="offer"><input type="checkbox" name="offer" required> <span>Принимаю условия <a href="/offer/" target="_blank">оферты</a></span></label>
        <label class="check" data-f="consent"><input type="checkbox" name="consent" required> <span>Даю <a href="/consent/" target="_blank">согласие на обработку персональных данных</a></span></label>
        <div id="err" class="notice err" style="display:none"></div>
        <button class="btn" id="pay" type="submit" style="margin-top:8px"></button>
        <p class="fine">Вернуть билет: за 10 дней и раньше — 100%, за 5–9 дней — 50%, за 3–4 дня — 30%, позже — нет. Если вечер отменится — 100%. Пишите на <a href="mailto:dimaantiosov@yandex.ru">dimaantiosov@yandex.ru</a> с номером заказа.</p>
      </form>
    </div></div>`;
    const $ = s => root.querySelector(s);
    const paint = () => { E.qty = Math.min(E.qty, max());
      const sl = shownLeft(P); $('#leftn').textContent = sl || '0'; $('#leftw').textContent = !sl ? 'мест нет' : plural(sl, 'место осталось', 'места осталось', 'мест осталось');
      $('#qty').innerHTML = Array.from({ length: max() }, (_, i) => `<option value="${i + 1}"${i + 1 === E.qty ? ' selected' : ''}>${i + 1}</option>`).join(''); $('#qty').disabled = !P.sales_open;
      $('#pay').textContent = label(); $('#pay').disabled = !P.sales_open || E.busy; };
    $('#qty').onchange = e => { E.qty = +e.target.value || 1; paint(); };
    paint();
    // Счётчик остатка живой: раз в 30 с перечитываем товар, пока вкладка на виду.
    setInterval(async () => { if (document.hidden || E.busy) return; await reload(); paint(); }, 30000);
    const FIELD_RU = { email: 'e-mail', qty: 'количество билетов', consent: 'согласие', offer: 'оферта', product_id: 'мероприятие' };
    const showErr = m => { $('#err').textContent = m; $('#err').style.display = ''; };
    const reload = async () => { try { const r = await api('product', { q: { s: slug } }); if (r.product) P = r.product; } catch (e) {} };
    $('#f').onsubmit = async e => {
      e.preventDefault(); if (E.busy || !P.sales_open) return;
      const f = new FormData(e.target); root.querySelectorAll('.field, .check').forEach(x => x.classList.remove('err')); $('#err').style.display = 'none';
      const body = { product_id: P.id, email: String(f.get('email') || '').trim(), qty: E.qty, offer: f.get('offer') === 'on', consent: f.get('consent') === 'on' };
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(body.email)) { showErr('Проверьте e-mail — на него придёт чек.'); $('[data-f="email"]').classList.add('err'); return; }
      if (!body.offer) { showErr('Нужно принять условия оферты.'); $('[data-f="offer"]').classList.add('err'); return; }
      if (!body.consent) { showErr('Нужно согласие на обработку данных.'); $('[data-f="consent"]').classList.add('err'); return; }
      E.busy = true; $('#pay').disabled = true; $('#pay').textContent = 'Секунду…';
      try { const r = await api('order', { method: 'POST', body }); location.href = r.paymentUrl; }
      catch (err) {
        const field = err.data && err.data.field;
        if (err.message === 'sold_out' || err.message === 'sales_closed') await reload();
        if (err.message === 'sales_closed') P.sales_open = false;
        E.busy = false; paint();
        const m = {
          sold_out: left() ? `Столько мест уже нет — осталось ${shownLeft(P)}.` : 'Места закончились.',
          sales_closed: 'Продажа закрыта.',
          validation: 'Проверьте поле: ' + (FIELD_RU[field] || 'данные формы') + '.',
          payment_init: 'Платёжная система не отвечает, попробуйте через минуту.',
          no_product: 'Этого мероприятия больше нет.',
          bad_json: 'Магазин временно недоступен, попробуйте через минуту.'
        }[err.message] || 'Что-то пошло не так, попробуйте ещё раз.';
        if (field) { const fl = root.querySelector(`.field[data-f="${field}"], .check[data-f="${field}"]`); if (fl) fl.classList.add('err'); }
        showErr(m);
      }
    };
    showAll();
  }
  // Практикум (диплом): имя для диплома + e-mail для чека. Диплом рисуется на странице заказа после оплаты.
  function diplomaPage() {
    const D = { busy: false }, label = () => 'Пройти практикум за ' + rub(P.price);
    root.innerHTML = `<div class="product">
    <div class="gallery">${(P.image_urls || []).map(u => `<img src="${esc(u)}" alt="${esc(P.title)}">`).join('') || '<img alt="">'}</div>
    <div>
      <h2>${esc(P.title)}</h2><div class="price">${rub(P.price)}</div>
      <div class="desc">${md(P.description_md)}</div>
      <form id="f" novalidate>
        <label class="field" data-f="name"><span>Имя</span><input name="name" type="text" autocomplete="name" maxlength="60" required></label>
        <label class="field" data-f="email"><span>E-mail — только для чека</span><input name="email" type="email" autocomplete="email" required></label>
        <label class="check" data-f="offer"><input type="checkbox" name="offer" required> <span>Принимаю условия <a href="/offer/" target="_blank">оферты</a></span></label>
        <label class="check" data-f="consent"><input type="checkbox" name="consent" required> <span>Даю <a href="/consent/" target="_blank">согласие на обработку персональных данных</a></span></label>
        <div id="err" class="notice err" style="display:none"></div>
        <button class="btn" id="pay" type="submit" style="margin-top:8px">${label()}</button>
        <p class="fine">Практикум засчитывается в момент оплаты: диплом появится на странице заказа сразу после неё. Подробно — в <a href="/offer/" target="_blank">оферте</a>. <a href="/merch/privacy/" target="_blank">Политика обработки персональных данных</a>.</p>
      </form>
    </div></div>`;
    const $ = s => root.querySelector(s);
    const FIELD_RU = { name: 'имя', email: 'e-mail', consent: 'согласие', offer: 'оферта', product_id: 'товар' };
    const showErr = m => { $('#err').textContent = m; $('#err').style.display = ''; };
    $('#f').onsubmit = async e => {
      e.preventDefault(); if (D.busy) return;
      const f = new FormData(e.target); root.querySelectorAll('.field, .check').forEach(x => x.classList.remove('err')); $('#err').style.display = 'none';
      const body = { product_id: P.id, name: String(f.get('name') || '').replace(/\s+/g, ' ').trim(), email: String(f.get('email') || '').trim(), offer: f.get('offer') === 'on', consent: f.get('consent') === 'on' };
      if (!body.name) { showErr('Впишите имя — оно будет в дипломе.'); $('[data-f="name"]').classList.add('err'); return; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(body.email)) { showErr('Проверьте e-mail — на него придёт чек.'); $('[data-f="email"]').classList.add('err'); return; }
      if (!body.offer) { showErr('Нужно принять условия оферты.'); $('[data-f="offer"]').classList.add('err'); return; }
      if (!body.consent) { showErr('Нужно согласие на обработку данных.'); $('[data-f="consent"]').classList.add('err'); return; }
      D.busy = true; $('#pay').disabled = true; $('#pay').textContent = 'Секунду…';
      try { const r = await api('order', { method: 'POST', body }); location.href = r.paymentUrl; }
      catch (err) {
        D.busy = false; $('#pay').disabled = false; $('#pay').textContent = label();
        const field = err.data && err.data.field;
        const m = {
          validation: 'Проверьте поле: ' + (FIELD_RU[field] || 'данные формы') + '.',
          payment_init: 'Платёжная система не отвечает, попробуйте через минуту.',
          no_product: 'Этого практикума больше нет.',
          bad_json: 'Магазин временно недоступен, попробуйте через минуту.'
        }[err.message] || 'Что-то пошло не так, попробуйте ещё раз.';
        if (field) { const fl = root.querySelector(`.field[data-f="${field}"], .check[data-f="${field}"]`); if (fl) fl.classList.add('err'); }
        showErr(m);
      }
    };
    showAll();
  }
  const S = { busy: false, soon: !P.has_file };
  const label = () => S.soon ? 'Скоро' : 'Купить за ' + rub(P.price);

  root.innerHTML = `<div class="product">
    <div class="gallery">${(P.image_urls || []).map(u => `<img src="${esc(u)}" alt="${esc(P.title)}">`).join('') || '<img alt="">'}</div>
    <div>
      <h2>${esc(P.title)}</h2>${P.free_active ? '' : `<div class="price">${rub(P.price)}</div>`}${P.downloads ? `<div class="dls">${P.downloads.toLocaleString('ru-RU')} ${plural(P.downloads, 'скачивание', 'скачивания', 'скачиваний')}</div>` : ''}
      <div class="desc">${md(P.description_md)}</div>
      ${P.free_active ? `<div class="free"><span class="meta">бесплатно ещё</span><div class="timer" id="timer">${countdown(P.free_until, skew).text}</div>
        <a class="btn" href="${MERCH_API}?a=free&s=${encodeURIComponent(P.id)}">Скачать бесплатно</a></div>` : ''}
      ${HOWTO}
      <form id="f" novalidate${P.free_active ? ' hidden' : ''}>
        <label class="field" data-f="email"><span>E-mail — пришлю туда ссылку на скачивание</span><input name="email" type="email" autocomplete="email" required></label>
        <label class="check" data-f="offer"><input type="checkbox" name="offer" required> <span>Принимаю условия <a href="/offer/" target="_blank">оферты</a></span></label>
        <label class="check" data-f="consent"><input type="checkbox" name="consent" required> <span>Даю <a href="/consent/" target="_blank">согласие на обработку персональных данных</a></span></label>
        <div id="err" class="notice err" style="display:none"></div>
        <button class="btn" id="pay" type="submit" style="margin-top:8px">${label()}</button>
        ${S.soon ? '<p class="meta soon" id="soon">архив ещё не готов — скоро</p>' : ''}
        <p class="fine">Это цифровой товар: после оплаты архив можно скачивать сколько угодно раз. Вернуть деньги можно, пока архив ни разу не скачан — подробно в <a href="/offer/" target="_blank">оферте</a>. <a href="/merch/privacy/" target="_blank">Политика обработки персональных данных</a>.</p>
      </form>
    </div></div>`;
  const $ = s => root.querySelector(s);
  $('#pay').disabled = S.soon;

  const FIELD_RU = { email: 'e-mail', consent: 'согласие', offer: 'оферта', product_id: 'товар' };
  const showErr = m => { $('#err').textContent = m; $('#err').style.display = ''; };
  $('#f').onsubmit = async e => {
    e.preventDefault(); if (S.busy || S.soon) return;
    const f = new FormData(e.target); root.querySelectorAll('.field, .check').forEach(x => x.classList.remove('err')); $('#err').style.display = 'none';
    const body = { product_id: P.id, email: String(f.get('email') || '').trim(), offer: f.get('offer') === 'on', consent: f.get('consent') === 'on' };
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(body.email)) { showErr('Проверьте e-mail — на него придёт ссылка.'); $('[data-f="email"]').classList.add('err'); return; }
    if (!body.offer) { showErr('Нужно принять условия оферты.'); $('[data-f="offer"]').classList.add('err'); return; }
    if (!body.consent) { showErr('Нужно согласие на обработку данных.'); $('[data-f="consent"]').classList.add('err'); return; }
    S.busy = true; $('#pay').disabled = true; $('#pay').textContent = 'Секунду…';
    try { const r = await api('order', { method: 'POST', body }); location.href = r.paymentUrl; }
    catch (err) {
      S.busy = false;
      const field = err.data && err.data.field;
      if (err.message === 'no_file') { S.soon = true; if (!$('#soon')) $('#pay').insertAdjacentHTML('afterend', '<p class="meta soon" id="soon">архив ещё не готов — скоро</p>'); }
      $('#pay').disabled = S.soon; $('#pay').textContent = label();
      const m = {
        no_file: 'Товар временно недоступен — архив ещё не загружен. Загляните чуть позже.',
        validation: 'Проверьте поле: ' + (FIELD_RU[field] || 'данные формы') + '.',
        payment_init: 'Платёжная система не отвечает, попробуйте через минуту.',
        no_product: 'Этого продукта больше нет.',
        bad_json: 'Магазин временно недоступен, попробуйте через минуту.'
      }[err.message] || 'Что-то пошло не так, попробуйте ещё раз.';
      if (field) { const fl = root.querySelector(`.field[data-f="${field}"], .check[data-f="${field}"]`); if (fl) fl.classList.add('err'); }
      showErr(m);
    }
  };
  // Таймер тикает раз в секунду; на нуле карточка перерисовывается уже без бесплатной кнопки (сервер к этому моменту отдаёт только платную).
  if (P.free_active) { const t = setInterval(() => { const c = countdown(P.free_until, skew); const el = document.getElementById('timer'); if (el) el.textContent = c.text; if (c.ms <= 0) { clearInterval(t); location.reload(); } }, 1000); }
  if (new URLSearchParams(location.search).get('free') === 'promo_over') showErr('Бесплатный период закончился — осталась платная версия.');
  showAll();
})();
</script>
<script src="../../assets/reveal.js"></script>
</body>
</html>
