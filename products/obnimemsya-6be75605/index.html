<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Дорогой друг — Дмитрий Антиосов</title>
  <!-- Спрятанная страница: сюда ведёт только QR на билете. Ссылок на неё нет, в sitemap её нет. -->
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400&display=swap">
  <style>
    /* Фото сверху, под ним текст той же ширины --w, по центру, 3–4 строки. 844/958 — пропорция фото. */
    html,body{margin:0;background:#fff;color:#0a0a0a}
    main{--w:min(calc(100vw - 32px),520px,calc(58svh * 844 / 958));min-height:100vh;min-height:100svh;box-sizing:border-box;padding:24px 0 32px;
      display:flex;flex-direction:column;align-items:center;justify-content:center}
    img{display:block;width:var(--w);height:auto}
    h1{box-sizing:border-box;width:var(--w);margin:20px 0 0;text-align:center;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:400;
      font-size:calc(var(--w) / 12.5);line-height:1.08;text-transform:uppercase;text-wrap:balance}
  </style>
</head>
<body>
<main>
  <img src="dmitry.png" alt="Дмитрий Антиосов с сосиской на вилке" />
  <h1>Дорогой друг, спасибо тебе за покупку билета! Приходи на стихи — обнимемся</h1>
</main>
</body>
</html>
