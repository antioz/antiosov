<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Дорогой друг — Дмитрий Антиосов</title>
  <!-- Спрятанная страница: сюда ведёт только QR на билете. Ссылок на неё нет, в sitemap её нет. -->
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400&display=swap">
  <style>
    /* Текст и фото одной ширины --w, по центру. 844/958 — пропорция фото: высота фото не больше 62% экрана. */
    html,body{margin:0;background:#fff;color:#0a0a0a}
    main{--w:min(calc(100vw - 32px),560px,calc(62svh * 844 / 958));min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;overflow:hidden}
    h1{box-sizing:border-box;width:var(--w);margin:0;padding-top:clamp(32px,7vh,90px);text-align:center;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:400;
      font-size:calc(var(--w) / 10.5);line-height:1.02;text-transform:uppercase;text-wrap:balance}
    img{display:block;margin-top:auto;width:var(--w);height:auto;padding-top:24px}
  </style>
</head>
<body>
<main>
  <h1>Дорогой друг, спасибо тебе за покупку билета! Приходи на стихи — обнимемся</h1>
  <img src="dmitry.png" alt="Дмитрий Антиосов с сосиской на вилке" />
</main>
</body>
</html>
