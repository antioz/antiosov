<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Заказ — Продукты — Дмитрий Антиосов</title>
  <meta name="robots" content="noindex" />

  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=Cormorant+Garamond:ital,wght@1,300;1,400&display=swap">

  <link rel="stylesheet" href="../../merch/merch.css" />
  <link rel="stylesheet" href="../products.css" />
  <link rel="stylesheet" href="../../assets/reveal.css" />
<script src="/assets/consent.js" defer></script>
</head>
<body>
<main>
  <p class="name r in"><a href="/">Дмитрий Антиосов</a></p>
  <div class="center" id="root"><p class="meta">проверяю оплату…</p></div>
  <footer><a href="/products/">← все продукты</a><a href="/merch/privacy/">персональные данные</a></footer>
</main>
<script src="../../merch/api.js"></script>
<script src="../products.js"></script>
<script>
(async () => {
  const q = new URLSearchParams(location.search), id = q.get('id'), k = q.get('k'), root = document.getElementById('root');
  const notFound = () => { root.innerHTML = '<p>Заказ не найден. <a href="/products/">Все продукты</a></p>'; };
  if (!id || !k) { notFound(); return; }
  const enc = encodeURIComponent;
  const payUrl = `${MERCH_API}?a=pay&id=${enc(id)}&k=${enc(k)}`;
  const dlUrl = `${MERCH_API}?a=download&id=${enc(id)}&k=${enc(k)}`;
  const download = s => `<p><a class="btn" id="dl" href="${dlUrl}">Скачать</a>
    ${s.downloaded ? '' : '<span class="fine" id="refund" style="display:block">Вернуть деньги можно, пока архив ни разу не скачан</span>'}</p>${HOWTO}`;
  // Мероприятие: билет — картинка PNG прямо на странице, писем нет.
  const ticketBlock = s => s.ticket ? `<div class="tk"><h2>Скачайте и сохраните билет</h2>
    <p class="fine">писем не будет — эта страница и есть ваш билет; сохраните картинку или ссылку</p>
    <img id="tkimg" alt="Электронный билет ${esc(s.ticket.number)}"><p><a class="btn" id="tkdl" download="bilet-${esc(s.ticket.number)}.png">Скачать билет (PNG)</a></p></div>` : '';
  const render = s => {
    const open = !!s.can_download, ev = s.kind === 'event';
    const t = ev ? {
      paid: ['Спасибо', `Заказ <b>${esc(id)}</b> оплачен. Чек придёт на <span style="white-space:nowrap">e-mail</span> от банка.`, ticketBlock(s)],
      done: ['Спасибо', `Заказ <b>${esc(id)}</b> оплачен. Чек придёт на <span style="white-space:nowrap">e-mail</span> от банка.`, ticketBlock(s)],
      new: ['Ждём оплату', `Заказ <b>${esc(id)}</b> ещё не оплачен.${q.get('fail') ? ' Оплата не прошла.' : ''}<br><br><a class="btn" href="${payUrl}">Вернуться к оплате</a><br><span class="meta">места держатся 20 минут</span>`],
      expired: ['Время вышло', `Заказ <b>${esc(id)}</b> не был оплачен за 20 минут, места вернулись в продажу. <a href="/products/">Оформить заново</a>.`],
      cancelled: ['Отменён', `Заказ <b>${esc(id)}</b> отменён. Если была оплата — деньги вернутся на карту. <a href="/products/">Оформить заново</a>.`]
    }[s.status] || ['Заказ', esc(s.status)] : {
      paid: ['Спасибо', `Заказ <b>${esc(id)}</b> оплачен. Ссылка на эту страницу ушла на почту — сюда можно вернуться и скачать архив ещё раз.`, open ? download(s) : ''],
      done: ['Готово', `Заказ <b>${esc(id)}</b> оплачен. Архив можно скачивать сколько нужно — всегда последняя версия.`, open ? download(s) : ''],
      new: ['Ждём оплату', `Заказ <b>${esc(id)}</b> ещё не оплачен.${q.get('fail') ? ' Оплата не прошла.' : ''}<br><br><a class="btn" href="${payUrl}">Вернуться к оплате</a><br><span class="meta">ссылка действует 20 минут</span>`],
      expired: ['Время вышло', `Заказ <b>${esc(id)}</b> не был оплачен за 20 минут. <a href="/products/">Оформить заново</a>.`],
      cancelled: ['Отменён', `Заказ <b>${esc(id)}</b> отменён. Если была оплата — деньги вернутся на карту.`]
    }[s.status] || ['Заказ', esc(s.status)];
    document.title = t[0] + ' — Продукты — Дмитрий Антиосов';
    root.innerHTML = `<h1 style="margin-bottom:24px">${t[0]}</h1><p>${t[1]}</p>${t[2] || ''}`;
    const dl = document.getElementById('dl');
    if (dl) dl.addEventListener('click', () => { const r = document.getElementById('refund'); if (r) r.remove(); });
    if (ev && document.getElementById('tkimg')) drawTicket(s.ticket).then(c => { const u = c.toDataURL('image/png'); document.getElementById('tkimg').src = u; document.getElementById('tkdl').href = u; })
      .catch(() => { document.getElementById('tkimg').replaceWith(Object.assign(document.createElement('p'), { textContent: 'Не получилось нарисовать билет — обновите страницу.' })); });
  };
  let tries = 0;
  const poll = async () => {
    try { const s = await api('status', { q: { id, k } }); render(s); if (s.status === 'new' && tries++ < 20) setTimeout(poll, 3000); }
    catch (e) { if (e.message === 'no_order' || e.code === 404) notFound(); else if (tries++ < 5) setTimeout(poll, 3000); else root.innerHTML = '<p>Не удалось проверить заказ. Обновите страницу через минуту.</p>'; }
  };
  poll();
})();
</script>
</body>
</html>
